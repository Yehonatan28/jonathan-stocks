# פידי RSS. quality = משקל המקור בציון החשיבות (1 עד 3).
# שומרים רק כותרת, קישור, מקור ושעה. אף פעם לא טקסט מלא.
rss:
  - {key: cnbc-markets, name: CNBC, quality: 3, url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"}
  - {key: cnbc-top, name: CNBC, quality: 3, url: "https://www.cnbc.com/id/100003114/device/rss/rss.html"}
  - {key: marketwatch, name: MarketWatch, quality: 3, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}
  - {key: marketwatch-pulse, name: MarketWatch, quality: 3, url: "https://feeds.content.dowjones.io/public/rss/mw_marketpulse"}
