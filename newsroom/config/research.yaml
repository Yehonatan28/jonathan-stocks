# 🔬 מעבדת הסטאפים: המחקר הטכני היומי.
# כל ערב אחרי הסגירה המערכת סורקת את "היקום" הזה, ובוחרת עד 3 סטאפים טכניים שקשורים לתיק.
# זה מידע וניתוח, לא ייעוץ ולא המלצה. ההחלטה תמיד שלך.

enabled: true
picks: 3                    # כמה סטאפים להציג בראש (במהדורה ובדשבורד)
shortlist: 8                # כמה עוד יופיעו ברשימה המורחבת בדשבורד
min_score: 60               # מתחת לציון הזה (0-100) לא מציגים, גם אם יוצאות פחות משלוש
run_after_et: "18:00"       # שעה בניו יורק שאחריה מתחיל המחקר (נתוני הסגירה כבר אצל Tiingo)
calls_per_run: 35           # כמה קריאות Tiingo מותר לכל הרצה (מכסה: 50 לשעה)
earnings_warning_days: 7    # דוח בטווח הזה = אזהרת "סיכון אירוע"
max_extension_pct: 8.0      # מעל זה מעל ממוצע 21 = "מתוח מדי", לא נכנס לרשימה

# המתחרות, הספקיות והדומות לכל החזקה. מכאן מגיע "הקשר לתיק".
peers:
  NVDA: [AMD, AVGO, TSM, MU, ARM, SMCI, ANET]
  MSFT: [ORCL, CRM, NOW, ADBE]
  GOOG: [META, TTD]
  AMZN: [SHOP, COST]
  AAPL: [QCOM]
  TSLA: [RIVN, GM, F]
  MSTR: [COIN, MARA, RIOT, HOOD]
  IBIT: [COIN, HOOD]
  XLE: [XOM, CVX, COP, SLB, OXY, EOG]
  TTWO: [EA, RBLX, U]
  WMT: [COST, TGT, KR, DG]
  SPCX: [RKLB, ASTS, LMT, NOC]
  MAGS: [META, NFLX]

# סקטור לכל סימול (תעודת הסל הסקטוריאלית שמייצגת אותו). משמש לחוזק יחסי ולקשר לתיק.
