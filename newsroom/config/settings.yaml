# הגדרות כלליות. כל שינוי כאן נכנס לתוקף בהרצה הבאה.

timezone_user: Asia/Jerusalem
timezone_market: America/New_York

# שעות שקט (שעון ישראל): רק התראות דחופות, ובלי צליל. (בשימוש משלב 2)
quiet_hours:
  start: "23:30"
  end: "06:30"

editions:
  preopen:
    minutes_before_open: 30    # 09:00 בניו יורק (נגזר מלוח הבורסה, כולל ימים מקוצרים)
    window_minutes: 45
  close:
    minutes_after_close: 15    # 16:15 בניו יורק, או 13:15 ביום מקוצר. נשלח בלי צליל.
    window_minutes: 150
    silent: true
  weekly:
    weekday: sun
    time: "08:00"              # שעון ישראל
    latest: "14:00"
  morning:
    time: "07:00"              # שעון ישראל
    earliest_minutes_before: 5 # מותר לשלוח עד 5 דקות לפני
    latest: "12:00"            # אם עד אז לא נשלחה (תקלה ממושכת), מוותרים להיום
    # ימים בשבוע (שעון ישראל). ראשון שמור לסיכום השבועי (שלב 4).
    weekdays: [mon, tue, wed, thu, fri, sat]

alerts:
  threshold: 7                 # ציון חשיבות מינימלי להתראה (1 עד 10)
  urgent: 9                    # מעל זה: דחוף (נשלח גם בשעות שקט, בלי צליל)
  cooldown_minutes: 120        # זמן צינון לכל נייר, אלא אם יש התפתחות מהותית
  daily_cap: 8                 # תקרה יומית להתראות לא דחופות. מעבר לזה -> למהדורה הבאה
  story_window_hours: 3        # "סיפור חם": כמה שעות אחורה סופרים מקורות
  hot_story_sources: 4         # כמה מקורות שונים הופכים סיפור ל"חם" גם אם הוא לא קשור לרשימה
  megacap_move_pct: 5.0        # מניה גדולה מחוץ לרשימה שזזה יותר מזה
  use_llm_rating: true         # המודל מוסיף דירוג משלו לציון (30% מהמשקל)

volatility:
  lookback_days: 60            # כמה ימי מסחר אחורה לחישוב סטיית התקן
  min_history_days: 20         # פחות מזה (מניה חדשה) -> סטיית תקן ברירת מחדל
  default_daily_stdev_pct: 3.0
  alert_sigma: 2.0             # "תנועה חריגה" (שלב 2: מפעיל התראה)
  notable_sigma: 1.0           # מספיק כדי להופיע ב"המניות שלי" במהדורה
  urgent_sigma: 3.5            # תנועה כזו היא דחופה

morning:
  max_my_stocks: 6
  hot_stories: 3
  news_lookback_hours: 24

# "המוח". החלפת ספק = שינוי provider. המודלים נוסים לפי הסדר:
# אם אחד יוצא משימוש או חסום, עוברים לבא. אם כולם נכשלים -> מהדורת גיבוי מתבנית.
llm:
  provider: gemini             # gemini | none
  models:
    - gemini-flash-latest
    - gemini-2.5-flash
    - gemini-flash-lite-latest
  temperature: 0.4
  max_retries: 4
  timeout_seconds: 60

# 🎧 גרסה קולית של מהדורת הבוקר (edge-tts, חינמי, בלי מפתח). נשלחת אחרי המהדורה הכתובה, בלי צליל.
# קולות: he-IL-AvriNeural (גבר) או he-IL-HilaNeural (אישה). rate: מהירות, למשל "+10%".
audio:
  enabled: true
  voice: he-IL-AvriNeural
  rate: "+5%"
  max_chars: 3500

sources:
  # גיבוי בלבד, ל-VIX, אג"ח 10 שנים, חוזים עתידיים ואסיה (אין להם מקור חינמי רשמי בזמן אמת).
  # false = המהדורה פשוט תכתוב "אין נתון".
  yahoo_fallback: true

dashboard_url: ""              # כתובת הדשבורד אחרי הפריסה, למשל https://newsroom-xyz.pages.dev
dashboard:
  min_push_minutes: 10         # עדכון נתוני הדשבורד לכל היותר פעם ב-10 דקות (מכסת KV: 1,000 כתיבות ביום)
archive_days: 90               # ארכיון כותרות נמחק אחרי 90 יום
