# פריסת "המעטפת" של הדשבורד (HTML/JS/CSS) ל-Cloudflare Workers.
# רצה רק כשקוד הדשבורד משתנה. הנתונים עצמם מתעדכנים בכל הרצה של הפעימה, ישר ל-KV, בלי פריסה.
name: dashboard

on:
  push:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          # Worker secrets (each one optional): the dashboard lock and instant bot commands
          DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_REF: ${{ github.event.repository.default_branch }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Cloudflare not configured yet"; exit 0; }
          sed -i "s/__KV_NAMESPACE_ID__/${CF_KV_NAMESPACE_ID}/" wrangler.toml
          npx --yes wrangler@4.40.0 deploy
          for name in DASHBOARD_KEY TG_WEBHOOK_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GH_DISPATCH_TOKEN GH_REPO GH_REF; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4.40.0 secret put "$name" >/dev/null && echo "secret $name set"
            fi
          done
