<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פנקס הבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Rubik:wght@500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: a household ledger. Month masthead, one summary band, then tabbed working sheets. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#f6f8f7; --sunk:#e8edec;
  --ink:#12201f; --ink-2:#465654; --muted:#76858299; --muted-s:#768582;
  --line:#dae2e0; --grid:#e6ecea;
  --accent:#0b6b6b; --accent-ink:#ffffff; --accent-soft:#dff0ee;
  --good:#0b7a3e; --good-soft:#e2f3e8; --bad:#c2362e; --bad-soft:#fbe8e6; --warn:#9a5a06; --warn-soft:#fcf0d9;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948; --c9:#98a3a1; --c0:#c6cfcd;
  --shadow:0 1px 0 rgba(18,32,31,.04),0 8px 24px -18px rgba(18,32,31,.35);
  --f-display:"Secular One","Heebo",system-ui,sans-serif;
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"Rubik","Heebo",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1312; --surface:#151d1c; --surface-2:#1a2423; --sunk:#111918;
  --ink:#ecf2f1; --ink-2:#b5c3c0; --muted-s:#86958f;
  --line:#283533; --grid:#212c2a;
  --accent:#4cb3ae; --accent-ink:#04201f; --accent-soft:#14302e;
  --good:#3cc47a; --good-soft:#11301f; --bad:#f07a70; --bad-soft:#3a1916; --warn:#f0b04a; --warn-soft:#33260e;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767; --c9:#6f7c79; --c0:#34413f;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1312; --surface:#151d1c; --surface-2:#1a2423; --sunk:#111918;
  --ink:#ecf2f1; --ink-2:#b5c3c0; --muted-s:#86958f;
  --line:#283533; --grid:#212c2a;
  --accent:#4cb3ae; --accent-ink:#04201f; --accent-soft:#14302e;
  --good:#3cc47a; --good-soft:#11301f; --bad:#f07a70; --bad-soft:#3a1916; --warn:#f0b04a; --warn-soft:#33260e;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767; --c9:#6f7c79; --c0:#34413f;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
h1,h2,h3{text-wrap:balance}
.n{direction:ltr;unicode-bidi:isolate;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted-s)} .small{font-size:12.5px;color:var(--muted-s)}
.pos{color:var(--good)} .neg{color:var(--bad)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted-s);font-weight:600}
.mast h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.05;margin:2px 0 0}
.mast .who{font-size:13px;color:var(--ink-2);margin-top:4px}
.mnav{display:flex;align-items:center;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13.5px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:var(--muted-s)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px}
.ib:hover{background:var(--surface-2)}
.ib.sm{display:inline-grid;width:28px;height:28px;font-size:13px;border-color:transparent;background:transparent;color:var(--muted-s)}
.ib.sm:hover{background:var(--sunk);color:var(--ink)}

/* summary band */
.band{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
.k{padding:12px 14px;border-inline-start:1px solid var(--line);min-width:0}
.k:first-child{border-inline-start:none}
.k .kl{font-size:12px;color:var(--muted-s);font-weight:600}
.k .kv{font-family:var(--f-num);font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.3px;direction:ltr;text-align:right;unicode-bidi:plaintext}
.k .kd{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.k[data-tone="good"] .kv{color:var(--good)} .k[data-tone="bad"] .kv{color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.flat{background:var(--sunk);color:var(--ink-2)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
@media(max-width:960px){.band{grid-template-columns:repeat(3,minmax(0,1fr))}.k:nth-child(4){border-inline-start:none}.k:nth-child(n+4){border-top:1px solid var(--line)}}
@media(max-width:560px){.band{grid-template-columns:repeat(2,minmax(0,1fr))}.k{border-inline-start:none!important;border-top:1px solid var(--line)}.k:nth-child(-n+2){border-top:none}.k:nth-child(even){border-inline-start:1px solid var(--line)!important}}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:none;background:none;padding:9px 14px;cursor:pointer;color:var(--ink-2);font-weight:600;font-size:14px;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}

/* sheets */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.sheet>h2{font-size:15.5px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sheet>h2 .sub{font-weight:400;color:var(--muted-s);font-size:12.5px}
.stack{display:grid;gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.g32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
@media(max-width:900px){.g2,.g32{grid-template-columns:minmax(0,1fr)}}

/* form */
.entry{display:grid;grid-template-columns:132px minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,.9fr) 110px minmax(0,.9fr) auto auto;gap:8px;align-items:end}
@media(max-width:980px){.entry{grid-template-columns:repeat(2,minmax(0,1fr))}.entry .wide{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11.5px;font-weight:600;color:var(--muted-s)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 9px;width:100%;min-width:0;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=number]{font-family:var(--f-num)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;white-space:nowrap;cursor:pointer;background:var(--surface)}
.chk input{width:auto;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--accent);min-height:18px;margin-top:6px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:560px}
.tw.free{max-height:none}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:11.5px;font-weight:700;color:var(--muted-s);padding:8px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:none}
td.num,th.num{text-align:left;white-space:nowrap}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
tr.grp td{background:var(--surface-2);font-weight:700;font-size:13px}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:7px;vertical-align:middle;flex:0 0 auto}
.catbtn{border:1px dashed transparent;background:none;padding:2px 6px;margin:-2px -6px;border-radius:7px;cursor:pointer;text-align:right;display:inline-flex;align-items:center}
.catbtn:hover{border-color:var(--line);background:var(--surface-2)}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;line-height:1.7}
.tag.fix{background:var(--warn-soft);color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tools .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools input,.tools select{width:auto;min-width:110px;font-size:13px;padding:6px 8px}

/* bars */
.bar{margin-bottom:10px}
.bar .bl{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:3px;align-items:baseline}
.bar .bl span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.track i{display:block;height:100%;border-radius:4px;transition:width .3s}
.track.over{background:var(--bad-soft)}
.mini{width:100%;min-width:90px}

/* charts */
svg.chart{direction:ltr;display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--muted-s);font-family:var(--f-num)}
.donut{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.legend{list-style:none;margin:0;padding:0;flex:1 1 200px;min-width:0;font-size:13px}
.legend li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--grid)}
.legend li:last-child{border-bottom:none}
.legend .lv{color:var(--ink-2)}
.lg{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}

/* notes, insights */
.note{border-radius:10px;padding:10px 12px;font-size:13px;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.ins{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--grid)}
.ins:last-child{border-bottom:none}
.ins .rail{border-radius:2px;background:var(--accent)}
.ins.good .rail{background:var(--good)} .ins.bad .rail{background:var(--bad)} .ins.warn .rail{background:var(--warn)}
.ins .it{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ins .id{font-size:13px;color:var(--ink-2);margin-top:2px}
.empty{text-align:center;color:var(--muted-s);padding:28px 10px;font-size:13.5px}
.heat{display:block;padding:3px 5px;border-radius:5px;text-align:left;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2)}
summary{cursor:pointer;font-weight:600;font-size:13.5px}
details ol{padding-inline-start:20px;font-size:13px;margin:8px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* overlays */
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:5px 9px;border-radius:7px;max-width:260px;opacity:0;transition:opacity .12s;white-space:pre-line}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:150;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 14px 30px -10px rgba(0,0,0,.5);transition:opacity .2s,translate .2s}
#toast[hidden]{display:none!important}
#toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:7px;padding:3px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
#modal{position:fixed;inset:0;z-index:120;background:rgba(8,14,13,.55);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none!important}
#modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
#modal h3{margin:0 0 6px;font-size:17px}
#modal .mb{font-size:13.5px;color:var(--ink-2);margin-bottom:16px}
#modal .mf{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
/* statement import */
.imp{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
@media(max-width:760px){.imp{grid-template-columns:minmax(0,1fr)}}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:10px;background:var(--accent-soft);cursor:pointer;text-align:center;padding:10px;font-size:13px;color:var(--ink-2)}
.drop b{color:var(--accent);font-size:14px}
.drop.over{border-style:solid;background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.drop.busy{pointer-events:none;opacity:.7}
.imprev td{padding:4px 6px}
.imprev input,.imprev select{padding:4px 6px;font-size:13px}
.imprev tr.off td{opacity:.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.save{font-size:12px;color:var(--muted-s);display:inline-flex;align-items:center;gap:5px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted-s)}
.save.cloud i{background:var(--good)} .save.busy i{background:var(--warn)} .save.err i{background:var(--bad)}
#mPick{width:auto;padding:6px 8px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <div class="eyebrow" id="eyebrow">פנקס הבית</div>
      <h1 id="mLabel">—</h1>
      <div class="who"><span id="whoLine"></span> · <span class="save" id="saveState"><i></i><span>שמור בדפדפן</span></span></div>
    </div>
    <div class="mnav">
      <button class="ib" data-act="mPrev" title="חודש קודם" aria-label="חודש קודם">→</button>
      <input type="month" id="mPick" aria-label="בחירת חודש"><button class="btn" data-act="mToday">החודש</button>
      <button class="ib" data-act="mNext" title="חודש הבא" aria-label="חודש הבא">←</button>
      <button class="ib" data-act="theme" title="מצב תצוגה" aria-label="החלפת מצב תצוגה" id="themeBtn"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </header>

  <section class="band" id="kpis" aria-label="סיכום החודש"></section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="entry">תנועות</button>
    <button class="tab" role="tab" data-tab="budget">תקציב</button>
    <button class="tab" role="tab" data-tab="compare">השוואה</button>
    <button class="tab" role="tab" data-tab="year">שנה</button>
    <button class="tab" role="tab" data-tab="insights">תובנות</button>
    <button class="tab" role="tab" data-tab="settings">הגדרות וגיבוי</button>
  </nav>

  <main>
    <section class="panel stack" id="panel-entry">
      <div id="banner" class="stack"></div>
      <div class="sheet" id="impSheet">
        <h2>ייבוא פירוט אשראי <span class="sub" id="impSub">PDF מחברת האשראי. התנועות מסווגות אוטומטית ותוכלו לאשר לפני ההוספה.</span></h2>
        <div class="imp">
          <label class="drop" id="drop" for="impFile"><b>גררו לכאן קובץ PDF</b><span>או לחצו לבחירה. גם צילום מסך של הפירוט עובד.</span><input type="file" id="impFile" accept="application/pdf,.pdf,image/png,image/jpeg,image/webp" hidden></label>
          <div class="f"><label for="impCard">כרטיס</label><input id="impCard" list="noteList" placeholder="כאל / מקס / ישראכרד"></div>
          <div class="f"><label for="impWho">של מי הכרטיס</label><select id="impWho"></select></div>
        </div>
        <div class="hint" id="impStatus"></div>
      </div>
      <div id="impReview"></div>
      <div class="sheet">
        <h2>תנועה חדשה <span class="sub" id="formMode">Enter מוסיף · תיאור מוכר ממלא קטגוריה לבד</span></h2>
        <form class="entry" id="rowForm" autocomplete="off">
          <div class="f"><label for="fDate">תאריך</label><input type="date" id="fDate" required></div>
          <div class="f wide"><label for="fDesc">תיאור / בית עסק</label><input id="fDesc" list="descList" placeholder="למשל: שופרסל"></div>
          <div class="f"><label for="fCat">קטגוריה</label><select id="fCat" required></select></div>
          <div class="f"><label for="fWho">מי שילם</label><select id="fWho"></select></div>
          <div class="f"><label for="fAmount">סכום</label><input type="number" id="fAmount" step="0.01" min="0" required inputmode="decimal"></div>

function demoData(n){
  const out={},cm=curMonth(),td=dayOf(todayISO());
  for(let i=n-1;i>=0;i--){
    const mk=addM(cm,-i),dmax=dimOf(mk);seed=1000+i*77;const rows=[];
    DEMO.forEach(([cat,desc,who,cnt,day,base,vf,fixed,note])=>{
      if(vf>.45&&rnd()<.25)return;
      for(let k=0;k<cnt;k++){
        const d=Math.min(dmax,day+k*9);if(mk===cm&&d>td)continue;
        const amt=Math.max(1,Math.round(base*(1+(rnd()*2-1)*vf)));
        rows.push({id:uid(),date:mk+'-'+pad(d),desc,cat,who,amount:amt,fixed:!!fixed,note});

    });

const memo=new Map();
function monthSums(mk){
  if(memo.has(mk))return memo.get(mk);
  const rows=rowsOf(mk),byCat={},byGroup={},byWho={},byWhoInc={},byNote={};
  let income=0,expense=0,fixed=0;
  rows.forEach(r=>{
    const c=catById(r.cat),amt=+r.amount||0;
    byCat[r.cat]=(byCat[r.cat]||0)+amt;
    if(c.type==='income'){income+=amt;byWhoInc[r.who]=(byWhoInc[r.who]||0)+amt;return;}
    expense+=amt;byGroup[c.group]=(byGroup[c.group]||0)+amt;byWho[r.who]=(byWho[r.who]||0)+amt;
    const nk=r.note||'ללא';byNote[nk]=(byNote[nk]||0)+amt;
    if(r.fixed)fixed+=amt;
  });
  const dim=dimOf(mk),cm=curMonth(),isCur=mk===cm,elapsed=isCur?Math.min(dim,dayOf(todayISO())):dim;
  /* forecast: fixed costs are already known, only variable spending is extrapolated */
  const proj=isCur&&elapsed>0?fixed+(expense-fixed)/elapsed*dim:expense;
  const budgetTotal=sum(state.cats.filter(c=>c.type==='expense'),c=>+c.budget||0);
  const res={mk,rows,count:rows.length,income,expense,fixed,balance:income-expense,saveRate:income>0?(income-expense)/income*100:null,
    byCat,byGroup,byWho,byWhoInc,byNote,dim,elapsed,isCur,proj,projBalance:income-proj,budgetTotal};
  memo.set(mk,res);return res;
}
function prevWithData(mk){const ms=monthsWithData().filter(k=>k<mk);return ms.length?ms[ms.length-1]:addM(mk,-1);}
function avg3(mk){
  const res={};let n=0;
  for(let i=1;i<=3;i++){const s=monthSums(addM(mk,-i));if(!s.count)continue;n++;
    Object.keys(s.byCat).forEach(c=>{if(catById(c).type==='expense')res[c]=(res[c]||0)+s.byCat[c];});}
  Object.keys(res).forEach(c=>res[c]/=Math.max(1,n));
  return {avg:res,n};
}
function sortRows(rows,mode){
  const c=[...rows];
  if(mode==='amount-desc')c.sort((a,b)=>b.amount-a.amount);
  else if(mode==='amount-asc')c.sort((a,b)=>a.amount-b.amount);
  else if(mode==='date-asc')c.sort((a,b)=>a.date.localeCompare(b.date));
  else c.sort((a,b)=>b.date.localeCompare(a.date));
  return c;
}

function colChart({labels,series,height=240}){
  const n=Math.max(1,labels.length),slot=Math.max(38,Math.min(74,640/n)),padR=40,padL=6,padT=14,padB=26;
  const W=n*slot+padR+padL,H=height,ih=H-padT-padB;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values.map(v=>Math.abs(+v||0)))));
  let g='';
  [0,.25,.5,.75,1].forEach(f=>{const y=padT+ih*(1-f);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" style="stroke:var(${f?'--grid':'--line'})" stroke-width="1"/>`;
    g+=`<text x="${W-padR+6}" y="${y+3.5}" font-size="10" text-anchor="start">${kf(max*f)}</text>`;});
  const inner=Math.min(slot-14,series.length*22),bw=Math.max(4,(inner-(series.length-1)*2)/series.length);
  labels.forEach((lb,i)=>{
    const sx=W-padR-(i+1)*slot,gx=sx+(slot-inner)/2;
    series.forEach((se,j)=>{
      const v=Math.abs(+se.values[i]||0),h=v>0?Math.max(2,v/max*ih):0,x=gx+(series.length-1-j)*(bw+2),y=padT+ih-h;
      g+=`<path d="${topRound(x,y,bw,h,4)}" style="fill:${se.color}"/>`;
      g+=`<rect x="${sx}" y="${padT}" width="${slot}" height="${ih}" fill="transparent" data-tip="${esc(lb)}\n${esc(series.map(s=>s.name+': '+money(s.values[i])).join('\n'))}"/>`;
    });
    g+=`<text x="${sx+slot/2}" y="${H-8}" font-size="10.5" text-anchor="middle">${esc(lb)}</text>`;
  });
  const lg=series.length>1?`<div class="lg">${series.map(s=>`<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>${lg}`;
}
function lineChart({labels,values,height=230,color='var(--accent)'}){
  const n=Math.max(2,labels.length),slot=Math.max(38,Math.min(74,640/n)),padR=44,padL=10,padT=16,padB=26;
  const W=n*slot+padR+padL,H=height,ih=H-padT-padB;
  const mn=Math.min(0,...values),mx=Math.max(1,...values),rng=(mx-mn)||1;
  const X=i=>W-padR-i*slot-slot/2,Y=v=>padT+ih*(1-(v-mn)/rng);
  let g='';
  [mn,mn+rng/2,mx].forEach(v=>{const y=Y(v);g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/><text x="${W-padR+6}" y="${y+3.5}" font-size="10">${kf(v)}</text>`;});
  if(mn<0)g+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--muted-s)" stroke-dasharray="3 3"/>`;
  const pts=values.map((v,i)=>[X(i),Y(v)]);
  g+=`<path d="M${pts[0][0]} ${Y(Math.max(mn,0))}L${pts.map(p=>p.join(' ')).join('L')}L${pts[pts.length-1][0]} ${Y(Math.max(mn,0))}Z" style="fill:${color}" opacity=".12"/>`;
  g+=`<path d="M${pts.map(p=>p.join(' ')).join('L')}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?5:3.5}" style="fill:${last?color:'var(--surface)'};stroke:${color}" stroke-width="2"/>`;
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent" data-tip="${esc(labels[i])}: ${esc(money(values[i]))}"/>`;
    g+=`<text x="${p[0]}" y="${H-8}" font-size="10.5" text-anchor="middle">${esc(labels[i])}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function donut(items,{size=176,th=26,center='',centerSub=''}={}){
  const list=items.filter(i=>i.value>0),total=sum(list,i=>i.value);
  if(!total)return '<div class="empty">אין עדיין הוצאות בחודש הזה</div>';
  const r=(size-th)/2,c=size/2,C=2*Math.PI*r;let off=0,segs='';
  list.forEach(it=>{const len=it.value/total*C,gap=list.length>1?Math.min(2,len/2):0;
    segs+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${it.color}" stroke-width="${th}" stroke-dasharray="${len-gap} ${C-len+gap}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})" data-tip="${esc(it.label)}: ${esc(money(it.value))} · ${Math.round(it.value/total*100)}%"/>`;off+=len;});
  const ctr=`<text x="${c}" y="${c+2}" font-size="20" font-weight="700" text-anchor="middle" style="fill:var(--ink)">${esc(center||kf(total))}</text><text x="${c}" y="${c+20}" font-size="11" text-anchor="middle">${esc(centerSub||cur())}</text>`;
  const lg=list.map(it=>`<li><span><span class="sw" style="background:${it.color}"></span>${esc(it.label)}</span><span class="lv">${N(it.value)} · ${Math.round(it.value/total*100)}%</span></li>`).join('');
  return `<div class="donut"><svg class="chart" viewBox="0 0 ${size} ${size}" style="width:${size}px;flex:0 0 ${size}px">${segs}${ctr}</svg><ul class="legend">${lg}</ul></div>`;
}
function bars(items,max){
  if(!items.length)return '<div class="empty">אין נתונים</div>';
  max=max||Math.max(1,...items.map(i=>Math.abs(i.value)));
  return items.map(it=>`<div class="bar"><div class="bl"><span>${it.sw?`<span class="sw" style="background:${it.color}"></span>`:''}${esc(it.label)}</span><b>${it.html||N(it.value)}</b></div><div class="track"><i style="width:${Math.min(100,Math.abs(it.value)/max*100)}%;background:${it.color}"></i></div></div>`).join('');
}
function progress(used,budget){
  if(!budget)return '<span class="small">ללא תקציב</span>';
  const p=used/budget*100,col=p>100?'var(--bad)':p>85?'var(--warn)':'var(--good)';
  return `<div class="track mini${p>100?' over':''}" data-tip="${Math.round(p)}% מהתקציב"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div>`;
}
function catOptions(sel,withAll){
  return (withAll?'<option value="all">כל הקטגוריות</option>':'')+GROUPS.map(g=>{const cs=state.cats.filter(c=>c.group===g);
    return cs.length?`<optgroup label="${esc(g)}">${cs.map(c=>`<option value="${esc(c.id)}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`:'';}).join('');
}

let toastT=null;
function toast(msg,action){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(action?`<button type="button">${esc(action.label)}</button>`:'');
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},action?7000:2600);
  if(action)t.querySelector('button').onclick=()=>{t.hidden=true;action.fn();};
}
function modal({title,body,buttons}){
  return new Promise(res=>{
    $('#mTitle').textContent=title;$('#mBody').innerHTML=body||'';
    $('#mFoot').innerHTML=buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('');
    const m=$('#modal');m.hidden=false;
    const done=v=>{m.hidden=true;m.onclick=null;document.removeEventListener('keydown',key);res(v);};
    const key=e=>{if(e.key==='Escape')done(null);};
    document.addEventListener('keydown',key);
    m.onclick=e=>{if(e.target===m)return done(null);const b=e.target.closest('#mFoot button');if(!b)return;const bt=buttons[+b.dataset.i];
      if(bt.keep){bt.fn&&bt.fn();return;}done(bt.value);};
    const first=$('#mFoot button');first&&first.focus();
  });
}
const confirmBox=(title,body,ok,danger)=>modal({title,body,buttons:[{label:ok,value:true,cls:danger?'danger':'pri'},{label:'ביטול',value:false,cls:'ghost'}]});
let DL=null;
async function saveFile(name,text,type){
  if(DL){try{await DL.save({filename:name,data:new Blob([text],{type})});toast('הקובץ נשמר: '+name);return true;}catch(e){if(e&&e.code==='declined')return true;return false;}}
  return download(name,text,type);
}
function download(name,text,type){
  try{const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},800);return true;}catch(e){return false;}
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('הועתק ללוח'),()=>selectFallback());}
  else selectFallback();
  function selectFallback(){const ta=$('#exportText');if(ta){ta.focus();ta.select();toast('סמנו והעתיקו ידנית (Ctrl+C)');}}
}
/* export shows the text too, because some viewers block file downloads */
function exportBox(title,name,text,type){
  modal({title,body:`<p style="margin:0 0 8px">הקובץ <b>${esc(name)}</b> ירד למחשב. אם ההורדה לא התחילה, העתיקו את התוכן ושמרו אותו בקובץ.</p><textarea id="exportText" rows="7" readonly style="font-family:monospace;font-size:12px;direction:ltr">${esc(text.length>400000?text.slice(0,400000)+'\n…':text)}</textarea>`,
    buttons:[{label:'העתק',cls:'pri',keep:true,fn:()=>copyText(text)},{label:'הורד שוב',keep:true,fn:()=>saveFile(name,text,type)},{label:'סגור',cls:'ghost',value:true}]});
  saveFile(name,text,type);
}
(function tooltip(){
  const tip=$('#tip');
  document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');
    if(!t){tip.classList.remove('on');return;}
    tip.textContent=t.getAttribute('data-tip');tip.classList.add('on');
    const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-10;
    if(x+w>innerWidth-8)x=e.clientX-w-14;if(y<8)y=e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px';});
})();

  $('#fDate').value=r.date;$('#fDesc').value=r.desc;$('#fCat').value=r.cat;$('#fWho').value=r.who;$('#fAmount').value=r.amount;$('#fNote').value=r.note||'';$('#fFixed').checked=!!r.fixed;
  $('#fSubmit').textContent='עדכן';$('#fCancel').hidden=false;$('#formMode').textContent='עריכת תנועה קיימת';
  window.scrollTo({top:$('#rowForm').getBoundingClientRect().top+scrollY-90,behavior:'smooth'});$('#fAmount').focus();renderRows();
}
function endEdit(){ui.editId=null;ui.catTouched=false;$('#fSubmit').textContent='הוסף';$('#fCancel').hidden=true;$('#formMode').textContent='Enter מוסיף · תיאור מוכר ממלא קטגוריה לבד';}
function onDescInput(){
  const v=$('#fDesc').value.trim().toLowerCase();if(!v||ui.editId){$('#fHint').textContent='';return;}
  const hit=merchantIndex().get(v);
  if(hit&&!ui.catTouched){
    $('#fCat').value=hit.cat;$('#fWho').value=hit.who;if(hit.note)$('#fNote').value=hit.note;$('#fFixed').checked=!!hit.fixed;
    if(!$('#fAmount').value&&hit.fixed)$('#fAmount').value=hit.amount;
    $('#fHint').textContent='זוהה מתנועה קודמת: '+catById(hit.cat).name+' · '+whoName(hit.who)+(hit.note?' · '+hit.note:'');
  }else $('#fHint').textContent='';
}
function recategorize(id,cat){
  const r=findRow(id);ui.recat=null;if(!r||r.cat===cat){renderRows();return;}
  const old=r.cat;r.cat=cat;commit();
  const same=allRows().filter(x=>x.id!==id&&x.desc&&x.desc===r.desc&&x.cat!==cat);
  if(same.length)toast(`עודכן ל${catById(cat).name}. יש עוד ${same.length} תנועות "${r.desc}".`,{label:'עדכן את כולן',fn:()=>{same.forEach(x=>x.cat=cat);commit();toast(same.length+' תנועות עודכנו');}});
  else toast('הקטגוריה עודכנה',{label:'בטל',fn:()=>{r.cat=old;commit();}});
}
function copyFixed(){
  const prev=monthsWithData().filter(k=>k<ui.month&&rowsOf(k).some(r=>r.fixed)).pop();
  if(!prev){toast('לא נמצא חודש קודם עם הוצאות קבועות');return;}
  const have=new Set(rowsOf(ui.month).map(r=>r.cat+'|'+r.desc));
  const add=rowsOf(prev).filter(r=>r.fixed&&!have.has(r.cat+'|'+r.desc));
  if(!add.length){toast('כל הקבועות מ'+mLabel(prev)+' כבר קיימות החודש');return;}
  state.data[ui.month]=state.data[ui.month]||{rows:[]};
  add.forEach(r=>state.data[ui.month].rows.push({...r,id:uid(),date:ui.month+'-'+pad(Math.min(dayOf(r.date),dimOf(ui.month)))}));
  commit();toast('הועתקו '+add.length+' תנועות קבועות מ'+mLabel(prev));
}

function renderInsights(){
  const mk=ui.month,s=monthSums(mk);

  const pm=prevWithData(mk),p=monthSums(pm),goal=+state.settings.goal||20,daysLeft=s.isCur?s.dim-s.elapsed:0,L=[];
  if(s.isCur&&s.elapsed>=3)L.push(ins(s.income&&s.projBalance<0?'bad':'info','תחזית לסוף '+MONTHS[+mk.slice(5)-1],
    `הוצאות משתנות של ${M((s.expense-s.fixed)/s.elapsed)} ביום בממוצע. בקצב הזה החודש ייסגר על ${M(s.proj)}${s.income?' ומאזן של '+M(s.projBalance):''}.`));
  if(!s.income)L.push(ins('warn','לא הוזנו הכנסות החודש','בלי משכורות אי אפשר לחשב מאזן ושיעור חיסכון. הוסיפו את המשכורות כתנועות הכנסה.'));
  else{const need=Math.max(0,goal/100*s.income-s.balance);
    L.push(ins(s.saveRate>=goal?'good':'warn','שיעור חיסכון '+Math.round(s.saveRate)+'%',s.saveRate>=goal?`מעל היעד של ${goal}%. נשארו ${M(s.balance)} מתוך ${M(s.income)}.`:`כדי להגיע ל-${goal}% חסרים ${M(need)}`+(daysLeft?`, כלומר ${M(need/daysLeft)} ביום עד סוף החודש.`:'.')));}
  const top=state.cats.filter(c=>c.type==='expense'&&s.byCat[c.id]).map(c=>({c,v:s.byCat[c.id]})).sort((a,b)=>b.v-a.v);
  if(top.length>2){const t3=top.slice(0,3),s3=sum(t3,x=>x.v);

/* ---------- 15. import / export ---------- */
function toCSV(months){
  const lines=[['תאריך','תיאור','קטגוריה','קבוצה','סוג','מי שילם','כרטיס','קבוע','סכום'].join(',')];
  months.forEach(mk=>sortRows(rowsOf(mk),'date-asc').forEach(r=>{const c=catById(r.cat);
    lines.push([r.date,r.desc,c.name,c.group,c.type==='income'?'הכנסה':'הוצאה',whoName(r.who),r.note,r.fixed?'כן':'לא',r.amount].map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(','));}));
  return '﻿'+lines.join('\n');
}
function parseBackup(text){const o=JSON.parse(text);if(!o||typeof o!=='object'||!o.data)throw new Error('missing data');return normalize(o);}
function dropDemo(){if(state.demo){state.data={};delete state.demo;state.settings.names=defSettings().names;}}
async function replaceFrom(text){
  let o;try{o=parseBackup(text);}catch(e){toast('הקובץ לא נראה כמו גיבוי של הפנקס. לא שיניתי כלום.');return;}
  const n=sum(Object.values(o.data),m=>m.rows.length);
  if(!state.demo&&allRows().length&&!await confirmBox('שחזור מלא','הנתונים הנוכחיים ('+allRows().length+' תנועות) יוחלפו ב-'+n+' תנועות מהקובץ.','החלף',true))return;
  state=o;delete state.demo;memo.clear();
  const ms=monthsWithData();ui.month=ms.includes(curMonth())||!ms.length?curMonth():ms[ms.length-1];
  if(ms.length&&!rowsOf(ui.month).length)ui.month=ms[ms.length-1];
  commit();fillForm();toast('שוחזרו '+n+' תנועות ב-'+ms.length+' חודשים');
}
function mergeFrom(text){
  let o;try{o=parseBackup(text);}catch(e){toast('הקובץ לא נראה כמו גיבוי של הפנקס. לא שיניתי כלום.');return;}
  const wasDemo=state.demo;if(wasDemo){dropDemo();state.settings=o.settings;}
  const ids=new Set(allRows().map(r=>r.id)),sig=new Set(allRows().map(r=>r.date+'|'+r.amount+'|'+r.desc));
  let added=0,dup=0;const months=new Set();
  o.cats.forEach(c=>{if(!state.cats.some(x=>x.id===c.id))state.cats.push(c);});
  Object.keys(o.data).forEach(mk=>o.data[mk].rows.forEach(r=>{
    if(ids.has(r.id)||sig.has(r.date+'|'+r.amount+'|'+r.desc)){dup++;return;}
    const k=r.date.slice(0,7);(state.data[k]=state.data[k]||{rows:[]}).rows.push(r);added++;months.add(k);}));
  if(months.size&&!rowsOf(ui.month).length)ui.month=[...months].sort().pop();
  commit();fillForm();toast(`נוספו ${added} תנועות`+(dup?`, ${dup} כפולות דולגו`:''));
}
function readFile(input,fn){const f=input.files&&input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{fn(String(rd.result));input.value='';};rd.readAsText(f);}

/* ---------- 15b. cloud save (artifact db): one doc per month + one config doc ---------- */
let DB=null,SAMPLE=null;
const synced={months:{},config:null};
const writeChain=new Map();
function setSave(kind,text){const el=$('#saveState');if(!el)return;el.className='save '+kind;el.lastChild.textContent=text;}
function cfgOf(){return JSON.stringify({settings:Object.assign({},state.settings,{sheetsLastSync:0}),cats:state.cats});}
function queueWrite(path,fn){
  const prev=writeChain.get(path)||Promise.resolve();
  const next=prev.catch(()=>{}).then(fn);writeChain.set(path,next);return next;
}
let pending=0;
function cloudPush(){
  if(!DB||state.demo)return;
  const jobs=[];
  Object.keys(state.data).forEach(mk=>{
    const str=JSON.stringify(rowsOf(mk));if(synced.months[mk]===str)return;synced.months[mk]=str;
    const rows=rowsOf(mk).map(r=>({...r}));
    jobs.push(queueWrite('months/'+mk,()=>DB.doc('months/'+mk).set({rows})));
  });
  Object.keys(synced.months).forEach(mk=>{if(!state.data[mk]){delete synced.months[mk];jobs.push(queueWrite('months/'+mk,()=>DB.doc('months/'+mk).delete()));}});
  const c=cfgOf();if(c!==synced.config){synced.config=c;const o=JSON.parse(c);jobs.push(queueWrite('meta/config',()=>DB.doc('meta/config').set(o)));}
  if(!jobs.length)return;
  pending+=jobs.length;setSave('busy','שומר…');
  Promise.allSettled(jobs).then(res=>{pending-=jobs.length;
    const bad=res.find(x=>x.status==='rejected');
    if(bad){setSave('err','השמירה בענן נכשלה');toast('השמירה בענן נכשלה. השינוי שמור בדפדפן הזה, ננסה שוב בשינוי הבא.');synced.config=null;synced.months={};}
    else if(!pending)setSave('cloud','נשמר בענן');});
}
let rerenderT=null;
function remoteChanged(){clearTimeout(rerenderT);rerenderT=setTimeout(()=>{memo.clear();try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}fillForm();render();},120);}
function applyMonthDoc(id,data){
  if(!/^\d{4}-\d{2}$/.test(id))return false;
  const rows=data&&Array.isArray(data.rows)?data.rows:[];const str=JSON.stringify(rows);
  if(synced.months[id]===str)return false;synced.months[id]=str;
  state.data[id]=normalize({data:{[id]:{rows}}}).data[id]||{rows:[]};return true;
}
function applyConfig(data){
  if(!data)return false;const str=JSON.stringify(data);if(str===synced.config)return false;synced.config=str;
  const n=normalize({settings:data.settings,cats:data.cats,data:{}});
  const keepSync={sheetsURL:state.settings.sheetsURL,sheetsLastSync:state.settings.sheetsLastSync};
  state.settings=Object.assign(n.settings,keepSync);state.cats=n.cats;return true;
}
async function connectCapabilities(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});
  claude.use('sample').then(sm=>{SAMPLE=sm;}).catch(()=>{});
  let db=null;try{db=await claude.use('db');}catch(e){}
  if(!db){setSave('','שמור בדפדפן הזה בלבד');return;}
  setSave('busy','מתחבר…');
  try{
    const [cfg,ms]=await Promise.all([db.doc('meta/config').get(),db.collection('months').get()]);
    DB=db;
    if(!cfg.exists&&ms.empty){
      /* first open with cloud save: move whatever this browser already has */
      if(!state.demo&&allRows().length){persist();toast('הנתונים מהדפדפן הועברו לשמירה בענן');}
      else setSave('cloud','מוכן לשמירה בענן');
    }else{
      if(state.demo){state.data={};delete state.demo;}
      const local=JSON.stringify(state.data);
      state.data={};synced.months={};
      if(cfg.exists)applyConfig(cfg.data());
      ms.docs.forEach(d=>applyMonthDoc(d.id,d.data()));
      const ms2=monthsWithData();if(!rowsOf(ui.month).length&&ms2.length&&ui.month===curMonth()&&!ms2.includes(curMonth()))ui.month=ms2[ms2.length-1];
      setSave('cloud','נשמר בענן');
      if(local!==JSON.stringify(state.data))remoteChanged();else render();
      fillForm();
    }
    db.collection('months').onSnapshot(snap=>{
      let ch=false;
      snap.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;
        if(c.type==='removed'){if(state.data[c.doc.id]){delete state.data[c.doc.id];delete synced.months[c.doc.id];ch=true;}}
        else if(applyMonthDoc(c.doc.id,c.doc.data()))ch=true;});
      if(ch)remoteChanged();
    },()=>setSave('err','החיבור לענן נותק'));
    db.doc('meta/config').onSnapshot(d=>{if(!d.metadata.hasPendingWrites&&d.exists&&applyConfig(d.data()))remoteChanged();});
  }catch(e){DB=null;setSave('err','אין חיבור לענן, שומר בדפדפן');}
}

const normDesc=d=>String(d||'').trim().toLowerCase().replace(/\s+/g,' ');
function guessCat(desc){
  const hit=merchantIndex().get(normDesc(desc));if(hit)return {cat:hit.cat,src:'history'};
  const kw=KW.find(([re])=>re.test(desc));if(kw&&state.cats.some(c=>c.id===kw[1]))return {cat:kw[1],src:'rule'};
  return null;
}
function loadScript(src){return new Promise((res,rej)=>{if($$('script').some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdfJs(){
  if(window.pdfjsLib&&window.pdfjsWorker)return;
  /* the worker runs on the main thread: the viewer only allows scripts from the CDN, not worker files */
  await loadScript(PDFJS+'pdf.worker.min.js');
  await loadScript(PDFJS+'pdf.min.js');
}
async function openPdf(buf){
  let password;
  for(;;){
    try{return await pdfjsLib.getDocument({data:buf.slice(0),password,isEvalSupported:false,useSystemFonts:true}).promise;}
    catch(e){
      if(e&&e.name==='PasswordException'){
        const v=await modal({title:'הקובץ מוגן בסיסמה',body:`<p style="margin:0 0 8px">${e.code===2?'הסיסמה לא נכונה. ':''}בחברות האשראי הסיסמה היא בדרך כלל מספר תעודת הזהות. היא לא נשמרת בשום מקום.</p><input type="password" id="pdfPass" autocomplete="off" style="direction:ltr">`,
          buttons:[{label:'פתח',cls:'pri',value:'ok'},{label:'ביטול',cls:'ghost',value:null}]});
        password=v==='ok'?($('#pdfPass')||{}).value:null;
        if(!password)throw {code:'cancelled'};
        continue;
      }
      throw e;
    }
  }
}
async function pdfToText(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),tc=await page.getTextContent(),lines=new Map();
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/4);
      if(!lines.has(y))lines.set(y,[]);lines.get(y).push({x:it.transform[4],s:it.str.trim()});});
    [...lines.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,items])=>out.push(items.sort((a,b)=>b.x-a.x).map(i=>i.s).join(' | ')));
    out.push('--- סוף עמוד '+p+' ---');
  }
  return out.join('\n');
}
async function pdfToImages(pdf,max){
  const blobs=[];
  for(let p=1;p<=Math.min(pdf.numPages,max);p++){
    const page=await pdf.getPage(p),vp=page.getViewport({scale:1.7}),cv=document.createElement('canvas');
    cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)));
  }
  return blobs;
}
function claudePrompt(text,card){
  const cats=state.cats.map(c=>`${c.id} = ${c.name} (${c.group}${c.type==='income'?', הכנסה':''})`).join('\n');
  const hints=[...merchantIndex().values()].slice(-150).map(r=>`${r.desc} -> ${r.cat}`).join('\n');
  return `You are reading an Israeli credit-card statement (פירוט חיובים) for a household budget app.
Extract EVERY purchase line. Card: ${card||'unknown'}. Today is ${todayISO()}.

Rules:
- date: the transaction date (תאריך עסקה) as YYYY-MM-DD. Two-digit years are 20xx.
- desc: the merchant name in readable Hebrew/English. PDF extraction sometimes reverses Hebrew letter order; fix it so words read correctly.
- amount: the amount CHARGED in this statement in ILS (סכום חיוב), a positive number. For installments (תשלום X מתוך Y) use this month's installment and set "installment":"X/Y". For foreign currency use the ILS charge.
- credit: true for refunds/credits (זיכוי, negative amounts); amount stays positive.
- fixed: true for standing orders / recurring subscriptions (הוראת קבע, מנוי, recurring monthly bills).
- cat: the best category id from this list:
${cats}
- Prefer the household's past choices for the same merchant:
${hints||'(no history yet)'}
- Skip summary lines, totals, previous-balance lines, interest tables, and bank debit lines (חיוב לחשבון).
- statementTotal: the total to be charged (סה"כ לחיוב) if printed, else null. chargeDate: the debit date (מועד חיוב) as YYYY-MM-DD if printed, else null.

Return ONLY JSON:
{"card":"<issuer name if visible>","statementTotal":number|null,"chargeDate":"YYYY-MM-DD"|null,"transactions":[{"date":"YYYY-MM-DD","desc":"...","amount":0,"cat":"<id>","fixed":false,"credit":false,"installment":null}]}
${text?'\nStatement text (columns separated by |, right-to-left order):\n'+text.slice(0,200000):'\nThe statement pages are attached as images.'}`;
}
/* fallback when Claude is not available: dates + amounts from each line */
function parseLocally(text){
  const out=[];
  text.split('\n').forEach(line=>{
    const dm=line.match(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);if(!dm)return;
    const am=[...line.matchAll(/-?\d{1,3}(?:,\d{3})*\.\d{2}|-?\d+\.\d{2}/g)].map(m=>m[0]);if(!am.length)return;
    let y=+dm[3];if(y<100)y+=2000;const d=+dm[1],m=+dm[2];if(m<1||m>12||d<1||d>31)return;
    const raw=am[am.length-1],amt=parseFloat(raw.replace(/,/g,''));if(!amt)return;
    let desc=line.replace(dm[0],'');am.forEach(a=>{desc=desc.replace(a,'');});
    desc=desc.split('|').map(x=>x.trim()).filter(x=>x&&/[א-תa-z]/i.test(x)).sort((a,b)=>b.length-a.length)[0]||'';
    if(!desc||/סה"?כ|יתרה|לחיוב/.test(desc))return;
    out.push({date:y+'-'+pad(m)+'-'+pad(d),desc,amount:Math.abs(amt),credit:amt<0,fixed:/הוראת קבע|הו"ק/.test(line),installment:(line.match(/(\d+)\s*מתוך\s*(\d+)/)||[]).slice(1).join('/')||null});
  });
  return {transactions:out,statementTotal:null};
}
function finishImport(res,meta){
  const tx=(res&&Array.isArray(res.transactions)?res.transactions:[]).filter(t=>t&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&+t.amount>0);
  if(!tx.length){impStatus('לא מצאתי תנועות בקובץ. נסו קובץ PDF אחר מאתר חברת האשראי, או צילום מסך ברור של הפירוט.','bad');return;}
  const existing=allRows();
  const rows=tx.map(t=>{
    const desc=String(t.desc||'').trim()||'ללא תיאור',amt=Math.round(+t.amount*100)/100;
    let cat=t.credit?'refund':t.cat,src='claude';
    const g=guessCat(desc);
    if(g&&(g.src==='history'||!state.cats.some(c=>c.id===cat)))({cat,src}=g);
    if(t.credit)cat='refund';
    if(!state.cats.some(c=>c.id===cat)){cat='other';src='none';}
    const dup=existing.some(r=>r.date===t.date&&Math.abs(r.amount-amt)<0.01)||existing.some(r=>r.date.slice(0,7)===t.date.slice(0,7)&&Math.abs(r.amount-amt)<0.01&&normDesc(r.desc)===normDesc(desc));
    return {on:!dup,dup,date:t.date,desc,cat,src,amount:amt,fixed:!!t.fixed,credit:!!t.credit,inst:t.installment||null};
  });
  ui.imp={rows,file:meta.file,card:meta.card||res.card||'',who:meta.who,total:+res.statementTotal||null,engine:meta.engine,monthMode:'date'};
  if(!$('#impCard').value&&res.card)$('#impCard').value=res.card;
  impStatus('');renderImport();
  $('#impReview').scrollIntoView({behavior:'smooth',block:'start'});
}

function impEdit(t){

  if(t.id==='impMonth'){I.monthMode=t.value;renderImport();return;}
  if(t.id==='impAll'){I.rows.forEach(r=>r.on=t.checked);renderImport();return;}
  const r=I.rows[+t.dataset.i];if(!r)return;const f=t.dataset.imp;
  if(f==='on'){r.on=t.checked;renderImport();}
  else if(f==='fixed')r.fixed=t.checked;
  else if(f==='desc')r.desc=t.value.trim()||r.desc;
  else if(f==='cat'){r.cat=t.value;r.src='user';
    /* same merchant elsewhere in this statement follows the change */
    I.rows.forEach(x=>{if(x!==r&&normDesc(x.desc)===normDesc(r.desc)&&x.src!=='user')x.cat=t.value;});renderImport();}
}

  mPrev:()=>{ui.month=addM(ui.month,-1);ui.cmpA=ui.cmpB=ui.year=null;render();},
  mNext:()=>{ui.month=addM(ui.month,1);ui.cmpA=ui.cmpB=ui.year=null;render();},
  mToday:()=>{ui.month=curMonth();ui.cmpA=ui.cmpB=ui.year=null;render();},
  theme:()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('budgetHH.theme',r.dataset.theme);}catch(e){}},
  cancelEdit:()=>{endEdit();$('#fDesc').value='';$('#fAmount').value='';$('#fNote').value='';$('#fDate').value=todayISO();renderRows();},
  quick:b=>{const r=ui.quick[+b.dataset.i];if(!r)return;$('#fDate').value=todayISO();$('#fDesc').value=r.desc;$('#fCat').value=r.cat;$('#fWho').value=r.who;$('#fAmount').value=r.amount;$('#fNote').value=r.note||'';$('#fFixed').checked=!!r.fixed;ui.catTouched=true;$('#fAmount').focus();$('#fHint').textContent='הטופס מולא. Enter כדי להוסיף.';},
  edit:b=>startEdit(b.dataset.id),
  del:b=>{const x=removeRow(b.dataset.id);if(!x)return;if(ui.editId===b.dataset.id)endEdit();commit();toast('נמחק: '+x.row.desc+' · '+money(x.row.amount),{label:'בטל',fn:()=>{state.data[x.k].rows.splice(x.i,0,x.row);commit();}});},
  recat:b=>{ui.recat=b.dataset.id;renderRows();},
  copyFixed,
  impAdd,
  impCancel:()=>{ui.imp=null;renderImport();impStatus('');},
  exportCSV:()=>exportBox('ייצוא CSV','budget-'+ui.month+'.csv',toCSV([ui.month]),'text/csv;charset=utf-8'),
  clearMonth:async()=>{const n=rowsOf(ui.month).length;if(!n){toast('החודש כבר ריק');return;}
    if(await confirmBox('איפוס '+mLabel(ui.month),n+' תנועות ב'+mLabel(ui.month)+' יימחקו. חודשים אחרים לא ייפגעו.','מחק '+n+' תנועות',true)){state.data[ui.month]={rows:[]};commit();toast('החודש אופס');}},
  goImport:()=>{go('settings');setTimeout(()=>{$('#backupSheet').scrollIntoView({behavior:'smooth'});},50);},
  startEmpty:()=>{dropDemo();commit();fillForm();toast('פנקס ריק מוכן. הוסיפו את התנועה הראשונה.');},
  suggest:()=>suggestBudgets(true),
  applyBudget:()=>suggestBudgets(false),
  showOther:()=>{ui.fCat='other';ui.search='';$('#fSearch').value='';go('entry');fillForm();},
  exportJSON:()=>exportBox('ייצוא גיבוי','budget-backup-'+todayISO()+'.json',JSON.stringify(Object.assign({},state,{demo:undefined}),null,1),'application/json'),
  exportCSVAll:()=>exportBox('ייצוא CSV','budget-all-'+todayISO()+'.csv',toCSV(Object.keys(state.data).sort()),'text/csv;charset=utf-8'),
  mergeText:()=>mergeFrom($('#importText').value),
  replaceText:()=>replaceFrom($('#importText').value),
  loadDemo:async()=>{if(allRows().length&&!state.demo&&!await confirmBox('נתוני דוגמה','הנתונים הנוכחיים יוחלפו בנתוני דוגמה. ייצאו גיבוי קודם אם צריך.','החלף',true))return;state.data=demoData(4);state.demo=true;commit();fillForm();},
  clearData:async()=>{if(await confirmBox('מחיקת כל התנועות',allRows().length+' תנועות יימחקו. קטגוריות ותקציבים יישארו.','מחק הכל',true)){state.data={};delete state.demo;commit();fillForm();}},
  resetAll:async()=>{if(await confirmBox('איפוס מלא','כל התנועות, הקטגוריות וההגדרות יחזרו לברירת המחדל.','אפס הכל',true)){state=defState();commit();fillForm();}},
  syncNow:()=>{syncNow();toast('נשלח ל-Google Sheets');},
  copyScript:()=>{if(navigator.clipboard)navigator.clipboard.writeText(APPS_SCRIPT).then(()=>toast('הקוד הועתק. הדביקו ב-Apps Script.'),()=>showScript());else showScript();},
  addcat:()=>{const nm=$('#newCatName').value.trim();if(!nm){toast('צריך שם לקטגוריה');return;}
    state.cats.push({id:uid(),name:nm,type:$('#newCatType').value,group:$('#newCatGroup').value,budget:Math.max(0,Math.round(+$('#newCatBudget').value||0))});commit();fillForm();toast('הקטגוריה נוספה');},
  delcat:async b=>{const id=b.dataset.id,c=catById(id),n=allRows().filter(r=>r.cat===id).length;
    if(id==='other'){toast('"הוצאות אחרות" משמשת כברירת מחדל ואי אפשר למחוק אותה');return;}
    if(n&&!await confirmBox('מחיקת '+c.name,n+' תנועות יעברו ל"הוצאות אחרות".','מחק',true))return;
    state.cats=state.cats.filter(x=>x.id!==id);if(!state.cats.some(x=>x.id==='other'))state.cats.push({id:'other',name:'הוצאות אחרות',type:'expense',group:'שונות',budget:0});
    allRows().forEach(r=>{if(r.cat===id)r.cat='other';});commit();fillForm();toast('הקטגוריה נמחקה');}
};
function showScript(){modal({title:'קוד Apps Script',body:`<textarea id="exportText" rows="10" readonly style="direction:ltr;font-family:monospace;font-size:11.5px">${esc(APPS_SCRIPT)}</textarea>`,buttons:[{label:'סגור',value:true}]}).then(()=>{});setTimeout(()=>{const t=$('#exportText');t&&t.select();},30);}
function bind(){
  document.addEventListener('click',e=>{
    const tg=e.target.closest('[data-tabgo]');if(tg){go(tg.dataset.tabgo);return;}
    const tab=e.target.closest('.tab');if(tab){go(tab.dataset.tab);return;}
    const b=e.target.closest('[data-act]');if(b&&!b.closest('#modal')&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act](b);}
  });
  $('#rowForm').addEventListener('submit',submitRow);
  $('#fDesc').addEventListener('input',onDescInput);
  $('#fCat').addEventListener('change',()=>{ui.catTouched=true;});
  $('#fSearch').addEventListener('input',e=>{ui.search=e.target.value;renderRows();});
  [['#fFilterCat','fCat'],['#fFilterWho','fWho'],['#fFilterNote','fNote'],['#fSort','sort']].forEach(([s,k])=>$(s).addEventListener('change',e=>{ui[k]=e.target.value;renderRows();}));
  document.addEventListener('change',e=>{
    const t=e.target,d=t.dataset;
    if(t.id==='mPick'){if(/^\d{4}-\d{2}$/.test(t.value)){ui.month=t.value;ui.cmpA=ui.cmpB=ui.year=null;render();}return;}
    if(t.id==='impFile'){if(t.files[0])importStatement(t.files[0]);t.value='';return;}
    if(t.closest&&t.closest('#impReview')){impEdit(t);return;}
    if(t.id==='recat'){recategorize(d.id,t.value);return;}
    if(t.id==='cmpA'){ui.cmpA=t.value;renderCompare();return;}
    if(t.id==='cmpB'){ui.cmpB=t.value;renderCompare();return;}
    if(t.id==='yearSel'){ui.year=t.value;renderYear();return;}
    if(t.id==='importFile'){readFile(t,replaceFrom);return;}
    if(t.id==='mergeFile'){readFile(t,mergeFrom);return;}
    if(d.budget){catById(d.budget).budget=Math.max(0,Math.round(+t.value||0));commit();return;}
    const s=state.settings;
    if(d.set==='nameA')s.names.a=t.value.trim()||'אני';
    else if(d.set==='nameB')s.names.b=t.value.trim()||'בן/בת הזוג';
    else if(d.set==='cur')s.cur=t.value.trim()||'₪';
    else if(d.set==='shared')s.shared=Math.min(100,Math.max(0,parseInt(t.value)||0));
    else if(d.set==='goal')s.goal=Math.min(90,Math.max(0,parseInt(t.value)||20));
    else if(d.set==='sheetsURL')s.sheetsURL=t.value.trim();
    else if(d.catName)catById(d.catName).name=t.value.trim()||catById(d.catName).name;
    else if(d.catGroup)catById(d.catGroup).group=t.value;
    else if(d.catType)catById(d.catType).type=t.value;
    else if(d.catBudget)catById(d.catBudget).budget=Math.max(0,Math.round(+t.value||0));
    else return;
    commit();fillForm();
  });
  document.addEventListener('focusout',e=>{if(e.target.id==='recat')setTimeout(()=>{if(ui.recat){ui.recat=null;renderRows();}},150);});
  document.addEventListener('keydown',e=>{
    if(e.target.matches('input,select,textarea')||!$('#modal').hidden)return;
    if(e.key==='ArrowRight'&&e.altKey)ACT.mPrev();if(e.key==='ArrowLeft'&&e.altKey)ACT.mNext();
  });
}
(function init(){
  try{
    try{const th=localStorage.getItem('budgetHH.theme');if(th)document.documentElement.dataset.theme=th;
      const tb=localStorage.getItem('budgetHH.tab');if(tb&&document.getElementById('panel-'+tb))ui.tab=tb;}catch(e){}
    const saved=loadSaved();
    state=normalize(saved||defState());
    if(!saved){state.data=demoData(4);state.demo=true;state.settings.names={a:'יעל',b:'עידו'};}
    const ms=monthsWithData();
    if(!rowsOf(ui.month).length&&ms.length)ui.month=ms[ms.length-1];
    $('#fDate').value=todayISO();
    fillForm();bind();render();bindImport();
    connectCapabilities();
  }catch(ex){
    console.error(ex);
    document.body.insertAdjacentHTML('afterbegin',`<div class="note bad" style="margin:16px"><b>שגיאה בטעינה:</b> ${esc(ex.message)}</div>`);
  }
})();
</script>
</body>
</html>
