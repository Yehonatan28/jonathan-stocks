<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ניהול תקציב יהונתן ורוני</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700&display=swap">
<style>
/* Layout: a household money desk. Month header, five live tiles, four sheets: this month, budget, comparison, trend. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface-2:#f7f9f8; --sunk:#e9eeec;
  --ink:#10201e; --ink-2:#44524f; --muted:#7a8885;
  --line:#dfe6e4; --grid:#e9eeec;
  --accent:#0d6b68; --accent-2:#13918c; --accent-ink:#ffffff; --accent-soft:#e0f1ef;
  --good:#0b7a3e; --good-soft:#e3f4ea; --bad:#c2362e; --bad-soft:#fbe9e7; --warn:#a05d05; --warn-soft:#fcf1dc;
  --prev:#c7d0ce;
  --k-home:#2a78d6; --k-bills:#4a3aa7; --k-super:#1baf7a; --k-eatout:#eb6834; --k-car:#e0a000; --k-subs:#e87ba4;
  --k-health:#e34948; --k-kids:#008300; --k-shopping:#9b6fd0; --k-fun:#22a6c0; --k-gifts:#c98a4b; --k-finance:#56738a;
  --k-transfers:#8a9a5b; --k-other:#9aa5a3; --k-salary:#0b7a3e; --k-extra:#38a169;
  --shadow:0 1px 0 rgba(16,32,30,.04),0 10px 30px -22px rgba(16,32,30,.45);
  --f-body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"Rubik","Heebo",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1211; --surface:#141c1b; --surface-2:#19221f; --sunk:#101716;
  --ink:#ecf2f0; --ink-2:#b4c2bf; --muted:#86948f;
  --line:#26322f; --grid:#1f2927;
  --accent:#4fb8b2; --accent-2:#6fd0ca; --accent-ink:#04201f; --accent-soft:#14302d;
  --good:#3cc47a; --good-soft:#11301f; --bad:#f07a70; --bad-soft:#3a1916; --warn:#f0b04a; --warn-soft:#33260e;
  --prev:#3a4846;
  --k-home:#3987e5; --k-bills:#9085e9; --k-super:#199e70; --k-eatout:#d95926; --k-car:#c98500; --k-subs:#d55181;
  --k-health:#e66767; --k-kids:#2f9a2f; --k-shopping:#a98be0; --k-fun:#2bb3cc; --k-gifts:#c99a62; --k-finance:#7d97ab;
  --k-transfers:#9fae6e; --k-other:#6f7c79; --k-salary:#3cc47a; --k-extra:#58c08a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -20px rgba(0,0,0,.85);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1211; --surface:#141c1b; --surface-2:#19221f; --sunk:#101716;
  --ink:#ecf2f0; --ink-2:#b4c2bf; --muted:#86948f;
  --line:#26322f; --grid:#1f2927;
  --accent:#4fb8b2; --accent-2:#6fd0ca; --accent-ink:#04201f; --accent-soft:#14302d;
  --good:#3cc47a; --good-soft:#11301f; --bad:#f07a70; --bad-soft:#3a1916; --warn:#f0b04a; --warn-soft:#33260e;
  --prev:#3a4846;
  --k-home:#3987e5; --k-bills:#9085e9; --k-super:#199e70; --k-eatout:#d95926; --k-car:#c98500; --k-subs:#d55181;
  --k-health:#e66767; --k-kids:#2f9a2f; --k-shopping:#a98be0; --k-fun:#2bb3cc; --k-gifts:#c99a62; --k-finance:#7d97ab;
  --k-transfers:#9fae6e; --k-other:#6f7c79; --k-salary:#3cc47a; --k-extra:#58c08a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 30px -20px rgba(0,0,0,.85);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 96px}
h1,h2,h3{text-wrap:balance}
.n{direction:ltr;unicode-bidi:isolate;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.small{font-size:12.5px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:18px}
.brand .eyebrow{font-size:13px;font-weight:600;color:var(--accent)}
.brand h1{font-size:clamp(30px,5vw,42px);font-weight:800;letter-spacing:-.5px;line-height:1.05;margin:2px 0 6px}
.save{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save.cloud i{background:var(--good)} .save.busy i{background:var(--warn)} .save.err i,.save.local i{background:var(--bad)}
.save.local{color:var(--bad);font-weight:600}
.mnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:15px;color:var(--ink)}
.ib:hover{border-color:var(--muted)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.ib.sm{width:28px;height:28px;font-size:13px;border-color:transparent;background:transparent;color:var(--muted)}
.ib.sm:hover{background:var(--sunk);color:var(--ink)}
#mPick{width:auto;padding:7px 9px;font-size:13px}

/* tiles */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:2px}
.k .kl{font-size:12.5px;color:var(--muted);font-weight:600}
.k .kv{font-family:var(--f-num);font-size:24px;font-weight:700;letter-spacing:-.4px;direction:ltr;text-align:right;unicode-bidi:plaintext;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k .kd{font-size:12px;color:var(--ink-2);min-height:24px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.k[data-tone="good"] .kv{color:var(--good)} .k[data-tone="bad"] .kv{color:var(--bad)}
.k.inc{background:linear-gradient(180deg,var(--good-soft),var(--surface) 70%)}
@media(max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.k .kv{font-size:20px}}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.7;white-space:nowrap;border:none}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.flat{background:var(--sunk);color:var(--ink-2)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.96)}

/* tabs */
.tabs{display:inline-flex;gap:2px;padding:4px;background:var(--sunk);border-radius:12px;margin-bottom:16px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tab{border:none;background:none;padding:8px 18px;cursor:pointer;color:var(--ink-2);font-weight:700;font-size:14px;border-radius:9px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel{display:grid;gap:14px}

/* sheets */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.sheet>h2{font-size:16px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sheet>h2 .sub{font-weight:500;color:var(--muted);font-size:12.5px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.g32{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.stack{display:grid;gap:14px;align-content:start}
@media(max-width:900px){.g2,.g32{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.note{border-radius:12px;padding:11px 14px;font-size:13.5px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}

/* forms */
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0;font-size:14px}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
input[type=number]{font-family:var(--f-num)}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.chk{display:flex;align-items:center;gap:7px;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--surface)}
.chk input{width:auto;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-size:12.5px;color:var(--accent);min-height:18px}

/* upload */
.uplgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:stretch}
@media(max-width:820px){.uplgrid{grid-template-columns:minmax(0,1fr)}}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:130px;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;background:var(--accent-soft);cursor:pointer;text-align:center;padding:14px;color:var(--ink-2);transition:background .15s}
.drop:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.drop b{color:var(--accent);font-size:16px}
.drop .ic{font-size:26px;line-height:1;color:var(--accent)}
.drop.over{border-style:solid;background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.drop.full{opacity:.5;pointer-events:none}
.files{display:grid;gap:6px;align-content:start}
.file{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.file .ft{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;background:var(--accent);letter-spacing:.3px}
.file .ft.pdf{background:#c2362e}.file .ft.img{background:#4a3aa7}
.file .fn{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fs{font-size:12px;color:var(--muted)}
.file.err{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-inline-end:4px}
@keyframes sp{to{transform:rotate(360deg)}}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:560px}
.tw.free{max-height:none}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;font-size:12px;font-weight:700;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:none}
td.num,th.num{text-align:left;white-space:nowrap}
td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:7px;vertical-align:middle;flex:0 0 auto}
.catbtn{border:1px dashed transparent;background:none;padding:2px 6px;margin:-2px -6px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap}
.catbtn:hover{border-color:var(--line);background:var(--surface-2)}
.tag{display:inline-block;font-size:11.5px;padding:0 7px;border-radius:6px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;line-height:1.75}
.tag.fix{background:var(--warn-soft);color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tools .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools input,.tools select{width:auto;min-width:110px;font-size:13px;padding:6px 8px}
.imprev td{padding:4px 6px}
.imprev input,.imprev select{padding:4px 6px;font-size:13px}
.imprev tr.off td{opacity:.42}
.imprev tr.fh td{background:var(--surface-2);font-weight:700}

/* category bars */
.cb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0}
.cb .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.cb .tr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px}
.cb .tr b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;border-radius:1px}
.cb .v{font-family:var(--f-num);font-size:13px;font-weight:600;white-space:nowrap;text-align:left;min-width:92px}
.cb .v span{color:var(--muted);font-weight:500;font-size:12px}
@media(max-width:560px){.cb{grid-template-columns:minmax(0,1fr) auto}.cb .tr{grid-column:1/-1;order:3}}
.hl{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--grid);align-items:start}
.hl:last-child{border-bottom:none}
.hl .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:14px}
.hl.good .ic{background:var(--good-soft);color:var(--good)} .hl.bad .ic{background:var(--bad-soft);color:var(--bad)} .hl.warn .ic{background:var(--warn-soft);color:var(--warn)}
.hl .t{font-weight:700;font-size:13.5px}
.hl .d{font-size:12.5px;color:var(--ink-2)}

/* budget */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:6px;position:relative;overflow:hidden}
.bc::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c)}
.bc .bn{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.bc .bs{font-family:var(--f-num);font-size:20px;font-weight:700;direction:ltr;text-align:right}
.bc .bb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.bc .bb input{width:96px;padding:4px 7px;font-size:13px}
.track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;transition:width .3s}
.bc.over{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.ring{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
@media(max-width:560px){.ring{grid-template-columns:minmax(0,1fr);justify-items:center}}

/* comparison */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;text-align:center}
.vs .side{padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.vs .side.cur{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.vs .lbl{font-size:13px;font-weight:700;color:var(--ink-2)}
.vs .big{font-family:var(--f-num);font-size:30px;font-weight:800;direction:ltr;letter-spacing:-.5px}
.vs .mid{display:grid;justify-items:center;gap:4px}
.vs .delta{font-family:var(--f-num);font-size:22px;font-weight:800;direction:ltr;white-space:nowrap}
.vs .mini{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:6px;flex-wrap:wrap}
@media(max-width:620px){.vs{grid-template-columns:minmax(0,1fr)}.vs .big{font-size:26px}}
.pair{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.pair:last-child{border-bottom:none}
.pair .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair .bars{display:grid;gap:3px}
.pair .bar{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--f-num)}
.pair .bar i{display:block;height:9px;border-radius:5px;min-width:2px}
.pair .chg{font-family:var(--f-num);font-size:13px;font-weight:700;white-space:nowrap;direction:ltr;min-width:84px;text-align:left}
@media(max-width:560px){.pair{grid-template-columns:minmax(0,1fr) auto}.pair .bars{grid-column:1/-1;order:3}}
.lgd{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.mover{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13.5px}
.mover:last-child{border-bottom:none}

/* trend */
.spk{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--grid)}
.spk:last-child{border-bottom:none}
.spk .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spk svg{width:100%;height:32px;display:block}
.spk .avg{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);white-space:nowrap;text-align:left}
@media(max-width:560px){.spk{grid-template-columns:minmax(0,1fr) auto}.spk svg{grid-column:1/-1;order:3}.spk .avg{display:none}}

/* charts */
svg.chart{direction:ltr;display:block;width:100%;height:auto;overflow:visible}
svg.chart text{fill:var(--muted);font-family:var(--f-num)}
svg.chart text.val{fill:var(--ink-2);font-weight:600}

/* overlays */
#tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .12s;white-space:pre-line}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:150;background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:12px;font-size:13.5px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 14px 30px -10px rgba(0,0,0,.5)}
#toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.dlg{position:fixed;inset:0;z-index:110;background:rgba(8,14,13,.5);display:grid;place-items:center;padding:16px}
.dlg .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(600px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dlghead h3{margin:0;font-size:18px;font-weight:800}
.entry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:end}
.entry .wide{grid-column:1/-1}
#fAmount{font-size:22px;padding:9px 11px;font-weight:700}
.seg{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;margin-bottom:12px}
.seg button{border:none;background:none;padding:7px 20px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--bad);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button[data-k="income"][aria-pressed="true"]{color:var(--good)}
#modal .mb{font-size:13.5px;color:var(--ink-2);margin-bottom:16px}
#modal .mf{display:flex;gap:8px;flex-wrap:wrap}
.fab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:90;width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 12px 26px -8px rgba(0,0,0,.45);display:none}
@media(max-width:760px){.fab{display:block}.mnav .addbtn{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const memo=new Map();
function monthSums(mk){
  if(memo.has(mk))return memo.get(mk);

function avgPrev(mk,n){

/* ---------- 4. cloud save: one doc per month + one config doc ---------- */
let DB=null,SAMPLE=null,DL=null;
const synced={months:{},config:null};
const writeChain=new Map();
function setSave(kind,text){const el=$('#saveState');if(!el)return;el.className='save '+kind;el.lastChild.textContent=text;}
const cfgOf=()=>JSON.stringify({settings:state.settings,cats:state.cats.map(c=>({id:c.id,budget:+c.budget||0}))});
const monthDoc=mk=>({rows:rowsOf(mk).map(r=>({...r})),fx:((state.data[mk]&&state.data[mk].fx)||[]).slice(),files:((state.data[mk]&&state.data[mk].files)||[]).map(f=>({...f}))});
function queueWrite(path,fn){const prev=writeChain.get(path)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);writeChain.set(path,next);return next;}
let pending=0;
function cloudPush(){
  if(!DB)return;
  const jobs=[];
  Object.keys(state.data).forEach(mk=>{
    const doc=monthDoc(mk),str=JSON.stringify(doc);if(synced.months[mk]===str)return;synced.months[mk]=str;
    jobs.push(queueWrite('months/'+mk,()=>DB.doc('months/'+mk).set(doc)));
  });
  const c=cfgOf();if(c!==synced.config){synced.config=c;const o=JSON.parse(c);jobs.push(queueWrite('meta/config',()=>DB.doc('meta/config').set(o)));}
  if(!jobs.length)return;
  pending+=jobs.length;setSave('busy','שומר…');
  Promise.allSettled(jobs).then(res=>{pending-=jobs.length;
    if(res.some(x=>x.status==='rejected')){setSave('err','השמירה בענן נכשלה, ננסה שוב בשינוי הבא');synced.config=null;synced.months={};}
    else if(!pending)setSave('cloud','נשמר בענן');});
}
let rerenderT=null;
function remoteChanged(){clearTimeout(rerenderT);rerenderT=setTimeout(()=>{memo.clear();try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}fillForm();render();},120);}
function applyCloudMonth(id,data){
  if(!/^\d{4}-\d{2}$/.test(id))return false;
  migrated=false;
  const n=normalize({settings:state.settings,data:{[id]:data||{}}}).data[id]||{rows:[],fx:[],files:[]};
  const str=JSON.stringify({rows:n.rows,fx:n.fx,files:n.files});
  if(synced.months[id]===str)return false;
  state.data[id]=n;synced.months[id]=migrated?null:str;return true;
}
function applyCloudConfig(data){
  if(!data)return false;
  migrated=false;
  const n=normalize({settings:data.settings,cats:data.cats,data:{}});
  const str=JSON.stringify({settings:n.settings,cats:n.cats.map(c=>({id:c.id,budget:+c.budget||0}))});
  if(str===synced.config)return false;
  state.settings=n.settings;state.cats=n.cats;synced.config=migrated?null:str;return true;
}
async function connectCapabilities(){
  if(!window.claude||typeof window.claude.use!=='function'){ui.db='none';setSave('local','שמור רק במחשב הזה');renderBanner();return;}
  claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});
  claude.use('sample').then(sm=>{SAMPLE=sm;}).catch(()=>{});
  let db=null;try{db=await claude.use('db');}catch(e){}
  if(!db){ui.db='none';setSave('local','לא מחובר לענן · שמור רק בדפדפן הזה');renderBanner();return;}
  setSave('busy','מתחבר…');
  try{
    const [cfg,ms]=await Promise.all([db.doc('meta/config').get(),db.collection('months').get()]);
    DB=db;
    const local=state,wasCloud=!!local.cloud;
    state={...local,data:{}};synced.months={};synced.config=null;
    if(cfg.exists)applyCloudConfig(cfg.data());
    ms.docs.forEach(d=>applyCloudMonth(d.id,d.data()));
    /* anything typed while this browser was not connected joins the cloud copy once */
    let added=0;
    if(!wasCloud){
      Object.keys(local.data).forEach(mk=>{const lm=local.data[mk];
        const cm=state.data[mk]||(state.data[mk]={rows:[],fx:[],files:[]});
        lm.rows.forEach(r=>{if(!allRows().some(x=>x.id===r.id)){cm.rows.push(r);added++;}});
        (lm.fx||[]).forEach(x=>{if(!cm.fx.includes(x))cm.fx.push(x);});
        (lm.files||[]).forEach(f=>{if(!cm.files.some(x=>x.id===f.id))cm.files.push(f);});
        if(!cm.rows.length&&!cm.files.length)delete state.data[mk];});
      (local.settings.fixed||[]).forEach(f=>{if(!state.settings.fixed.some(x=>x.id===f.id))state.settings.fixed.push(f);});
      if(!cfg.exists){state.settings=local.settings;state.cats=local.cats;}
    }
    state.cloud=true;
    if(!ui.touched)ui.month=openMonth();
    memo.clear();persist();fillForm();render();
    if(!pending)setSave('cloud','נשמר בענן');
    if(added)toast((added===1?'תנועה אחת שנשמרה':added+' תנועות שנשמרו')+' רק בדפדפן הזה '+(added===1?'הועברה':'הועברו')+' לענן');
    db.collection('months').onSnapshot(snap=>{let ch=false;
      snap.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;
        if(c.type==='removed'){if(state.data[c.doc.id]){delete state.data[c.doc.id];delete synced.months[c.doc.id];ch=true;}}
        else if(applyCloudMonth(c.doc.id,c.doc.data()))ch=true;});
      if(ch)remoteChanged();},()=>setSave('err','החיבור לענן נותק'));
    db.doc('meta/config').onSnapshot(d=>{if(!d.metadata.hasPendingWrites&&d.exists&&applyCloudConfig(d.data()))remoteChanged();});
  }catch(e){DB=null;setSave('err','אין חיבור לענן · שומר בדפדפן');}
}

/* ---------- 5. charts ---------- */
function topRound(x,y,w,h,r){r=Math.min(r,w/2,h);if(h<=0)return '';return `M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`;}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;}
/* columns run right to left, like the page */
function colChart({labels,series,height=230,values=false,netLine=null}){
  const n=Math.max(1,labels.length),slot=Math.max(30,Math.min(96,700/n)),padR=42,padL=6,padT=values?22:12,padB=26;
  const W=n*slot+padR+padL,H=height,ih=H-padT-padB;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.values.map(v=>Math.abs(+v||0)))));
  let g='';
  [0,.5,1].forEach(f=>{const y=padT+ih*(1-f);
    g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" style="stroke:var(${f?'--grid':'--line'})"/>`;
    g+=`<text x="${W-padR+6}" y="${y+3.5}" font-size="10">${kf(max*f)}</text>`;});
  const inner=Math.min(slot-10,series.length*26),bw=Math.max(3,(inner-(series.length-1)*3)/series.length);
  labels.forEach((lb,i)=>{
    const sx=W-padR-(i+1)*slot,gx=sx+(slot-inner)/2;
    series.forEach((se,j)=>{
      const v=Math.abs(+se.values[i]||0),h=v>0?Math.max(2,v/max*ih):0,x=gx+(series.length-1-j)*(bw+3),y=padT+ih-h;
      g+=`<path d="${topRound(x,y,bw,h,4)}" style="fill:${se.color}"/>`;
      if(values&&v>0&&n<=12)g+=`<text class="val" x="${x+bw/2}" y="${y-5}" font-size="9.5" text-anchor="middle">${kf(v)}</text>`;
    });
    g+=`<rect x="${sx}" y="${padT}" width="${slot}" height="${ih}" fill="transparent" data-tip="${esc(lb)}\n${esc(series.map(s=>s.name+': '+money(s.values[i])).join('\n'))}"/>`;
    g+=`<text x="${sx+slot/2}" y="${H-8}" font-size="10.5" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function lineChart({labels,values,height=210,color='var(--accent)'}){
  const n=Math.max(2,labels.length),slot=Math.max(40,Math.min(110,700/n)),padR=46,padL=12,padT=22,padB=26;
  const W=n*slot+padR+padL,H=height,ih=H-padT-padB;
  const mn=Math.min(0,...values),mx=Math.max(0,...values),rng=(mx-mn)||1;
  const X=i=>W-padR-i*slot-slot/2,Y=v=>padT+ih*(1-(v-mn)/rng);
  let g='';
  [mn,mx].forEach(v=>{const y=Y(v);g+=`<line x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}" style="stroke:var(--grid)"/><text x="${W-padR+6}" y="${y+3.5}" font-size="10">${kf(v)}</text>`;});
  if(mn<0)g+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--muted)" stroke-dasharray="3 3"/>`;
  const pts=values.map((v,i)=>[X(i),Y(v)]),base=Y(Math.max(mn,0));
  g+=`<path d="M${pts[0][0]} ${base}L${pts.map(p=>p.join(' ')).join('L')}L${pts[pts.length-1][0]} ${base}Z" style="fill:${color}" opacity=".13"/>`;
  g+=`<path d="M${pts.map(p=>p.join(' ')).join('L')}" fill="none" style="stroke:${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${last?5.5:3.5}" style="fill:${last?color:'var(--surface)'};stroke:${color}" stroke-width="2"/>`;
    g+=`<text class="val" x="${p[0]}" y="${p[1]-10}" font-size="10" text-anchor="middle">${kf(values[i])}</text>`;
    g+=`<circle cx="${p[0]}" cy="${p[1]}" r="16" fill="transparent" data-tip="${esc(labels[i])}: ${esc(money(values[i]))}"/>`;
    g+=`<text x="${p[0]}" y="${H-8}" font-size="10.5" text-anchor="middle">${esc(labels[i])}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function spark(vals,color,labels){
  const W=160,H=32,n=vals.length,mx=Math.max(1,...vals),X=i=>n<2?W/2:W-4-i*(W-8)/(n-1),Y=v=>H-4-(v/mx)*(H-8);
  if(n<2)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><circle cx="${W/2}" cy="${Y(vals[0]||0)}" r="3.5" style="fill:${color}"/></svg>`;
  const pts=vals.map((v,i)=>X(i)+' '+Y(v));
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="direction:ltr"><path d="M${X(0)} ${H}L${pts.join('L')}L${X(n-1)} ${H}Z" style="fill:${color}" opacity=".14"/><path d="M${pts.join('L')}" fill="none" style="stroke:${color}" stroke-width="2" vector-effect="non-scaling-stroke"/>${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===n-1?3.2:2}" style="fill:${color}"><title>${esc(labels[i])}: ${esc(money(v))}</title></circle>`).join('')}</svg>`;
}
function donutRing(used,total,size=150){
  const th=16,r=(size-th)/2,c=size/2,C=2*Math.PI*r,p=total>0?Math.min(1,used/total):0,over=total>0&&used>total;
  const col=over?'var(--bad)':p>.85?'var(--warn)':'var(--accent)';
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" style="width:${size}px;flex:0 0 ${size}px"><circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:var(--sunk)" stroke-width="${th}"/>
   ${p>0?`<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${col}" stroke-width="${th}" stroke-linecap="round" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 ${c} ${c})"/>`:''}
   <text x="${c}" y="${c+4}" font-size="26" font-weight="800" text-anchor="middle" style="fill:var(--ink)">${total?Math.round(used/total*100)+'%':'—'}</text>
   <text x="${c}" y="${c+24}" font-size="11" text-anchor="middle">מהתקציב</text></svg>`;
}
function catOptions(sel,type,withAll){

let toastT=null;
function toast(msg,action){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(action?`<button type="button">${esc(action.label)}</button>`:'');
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},action?7000:2800);
  if(action)t.querySelector('button').onclick=()=>{t.hidden=true;action.fn();};
}
function modal({title,body,buttons}){
  return new Promise(res=>{
    $('#mTitle').textContent=title;$('#mBody').innerHTML=body||'';
    $('#mFoot').innerHTML=buttons.map((b,i)=>`<button type="button" class="btn ${b.cls||''}" data-i="${i}">${esc(b.label)}</button>`).join('');
    const m=$('#modal');m.hidden=false;
    const done=v=>{m.hidden=true;m.onclick=null;document.removeEventListener('keydown',key);res(v);};
    const key=e=>{if(e.key==='Escape')done(null);};
    document.addEventListener('keydown',key);
    m.onclick=e=>{if(e.target===m)return done(null);const b=e.target.closest('#mFoot button');if(b)done(buttons[+b.dataset.i].value);};
    const first=$('#mFoot button');first&&first.focus();
  });
}
const confirmBox=(title,body,ok)=>modal({title,body,buttons:[{label:ok,value:true,cls:'danger'},{label:'ביטול',value:false,cls:'ghost'}]});
async function saveFile(name,text,type){
  if(DL){try{await DL.save({filename:name,data:new Blob([text],{type})});return true;}catch(e){return e&&e.code==='declined';}}
  try{const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},800);return true;}catch(e){return false;}
}
(function tooltip(){
  const tip=$('#tip');

    if(!t){tip.classList.remove('on');return;}

function highlights(s,p,pm){
  const L=[],h=(k,ic,t,d)=>L.push(`<div class="hl ${k}"><div class="ic">${ic}</div><div><div class="t">${t}</div><div class="d">${d}</div></div></div>`);
  if(!s.count)return '<div class="empty">אחרי שתעלו פירוטים יופיעו כאן הדברים החשובים.</div>';
  const top=state.cats.filter(c=>c.type==='expense'&&s.byCat[c.id]).map(c=>({c,v:s.byCat[c.id]})).sort((a,b)=>b.v-a.v);
  if(top.length)h('','①',esc(top[0].c.name)+' היא ההוצאה הגדולה',M(top[0].v)+', '+Math.round(top[0].v/s.expense*100)+'% מכל ההוצאות.');
  if(p&&p.expCount&&!s.isCur){
    const d=state.cats.filter(c=>c.type==='expense').map(c=>({c,d:(s.byCat[c.id]||0)-(p.byCat[c.id]||0)})).filter(x=>Math.abs(x.d)>=50).sort((a,b)=>b.d-a.d);
    if(d.length&&d[0].d>0)h('bad','▲',esc(d[0].c.name)+' עלתה',M(d[0].d)+' יותר מ'+esc(mName(pm))+'.');
    const dn=d[d.length-1];if(dn&&dn.d<0)h('good','▼',esc(dn.c.name)+' ירדה',M(-dn.d)+' פחות מ'+esc(mName(pm))+'.');
  }
  if(s.isCur&&s.elapsed>=3&&s.expense)h('warn','≈','צפי לסוף החודש: '+esc(money(s.proj)),'לפי הקצב עד היום, כולל הקבועות.');
  const big=sortRows(s.rows.filter(r=>!isInc(r)),'amount')[0];
  if(big)h('','₪','ההוצאה הכי גדולה',esc(big.desc)+' · '+M(big.amount)+' · '+dayOf(big.date)+'/'+(+big.date.slice(5,7)));
  const unk=(s.byCat.other||0);
  if(unk>s.expense*.12)h('warn','?',M(unk)+' ב"שונות"','לחצו על שם הקטגוריה בטבלה למטה כדי לשייך. אפשר לעדכן בבת אחת את כל התנועות מאותו בית עסק.');
  const over=state.cats.filter(c=>c.budget>0&&(s.byCat[c.id]||0)>c.budget);
  if(over.length)h('bad','!',over.length+' קטגוריות מעל התקציב',over.map(c=>esc(c.name)).join(' · '));
  return L.join('');
}

  const kw=KW.find(([re])=>re.test(desc||''));if(kw)return {cat:kw[1],src:'rule'};

}
function cardFromName(t){
  const s=String(t||'').toLowerCase();
  if(/כאל|\bcal\b|visa ?cal/.test(s))return 'כאל';if(/מקס|\bmax\b|leumi ?card|לאומי קארד/.test(s))return 'מקס';
  if(/ישראכרט|ישראכרד|isracard/.test(s))return 'ישראכרד';if(/אמריקן|amex|american express/.test(s))return 'אמריקן אקספרס';

function ownerOf(card){

async function pdfToText(pdf){
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p),tc=await page.getTextContent(),lines=new Map();
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=Math.round(it.transform[5]/4);if(!lines.has(y))lines.set(y,[]);lines.get(y).push({x:it.transform[4],s:it.str.trim()});});
    [...lines.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,items])=>out.push(items.sort((a,b)=>b.x-a.x).map(i=>i.s).join(' | ')));
    out.push('--- סוף עמוד '+p+' ---');
  }
  return out.join('\n');
}
async function pdfToImages(pdf,max){
  const blobs=[];
  for(let p=1;p<=Math.min(pdf.numPages,max);p++){const page=await pdf.getPage(p),vp=page.getViewport({scale:1.7}),cv=document.createElement('canvas');
    cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)));}
  return blobs;
}

${text?'\nStatement text (columns separated by |, right-to-left):\n'+text.slice(0,200000):'\nThe statement pages are attached as images.'}`;

function parseLocally(text){
  const out=[];
  text.split('\n').forEach(line=>{
    const dm=line.match(/(\d{1,2})[./](\d{1,2})[./](\d{2,4})/);if(!dm)return;
    const am=[...line.matchAll(/-?\d{1,3}(?:,\d{3})*\.\d{2}|-?\d+\.\d{2}/g)].map(m=>m[0]);if(!am.length)return;
    let y=+dm[3];if(y<100)y+=2000;const d=+dm[1],m=+dm[2];if(m<1||m>12||d<1||d>31)return;
    const amt=parseFloat(am[am.length-1].replace(/,/g,''));if(!amt)return;
    let desc=line.replace(dm[0],'');am.forEach(a=>{desc=desc.replace(a,'');});
    desc=desc.split('|').map(x=>x.trim()).filter(x=>x&&/[א-תa-z]/i.test(x)).sort((a,b)=>b.length-a.length)[0]||'';
    if(!desc||/סה"?כ|יתרה|לחיוב/.test(desc))return;
    out.push({date:y+'-'+pad(m)+'-'+pad(d),desc,amount:Math.abs(amt),credit:amt<0,fixed:/הוראת קבע|הו"ק/.test(line),installment:(line.match(/(\d+)\s*מתוך\s*(\d+)/)||[]).slice(1).join('/')||null});
  });
  return {transactions:out,statementTotal:null,card:cardFromName(text.slice(0,3000))};
}
function buildRows(res){
  const tx=(res&&Array.isArray(res.transactions)?res.transactions:[]).filter(t=>t&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&+t.amount>0);
  const existing=allRows(),pendingRows=ui.queue.flatMap(q=>q.rows||[]);
  return tx.map(t=>{
    const desc=String(t.desc||'').trim()||'ללא תיאור',amt=Math.round(+t.amount*100)/100;
    let cat=state.cats.some(c=>c.id===t.cat&&c.type==='expense')?t.cat:null;
    const g=guessCat(desc);if(g&&(g.src==='history'||!cat||cat==='other'))cat=g.cat;
    if(t.credit)cat='extra';if(!cat)cat='other';
    const same=r=>r.date===t.date&&Math.abs(r.amount-amt)<0.01;

function addFiles(list){

let qBusy=false;
async function processQueue(){
  if(qBusy)return;qBusy=true;
  try{
    for(const q of ui.queue){
      if(q.status!=='waiting')continue;
      q.status='reading';renderFiles();
      try{
        let text='',images=null;
        if(q.type!=='PDF')images=[q.file];
        else{
          await loadPdfJs();
          const pdf=await openPdf(await q.file.arrayBuffer(),q.name);
          text=await pdfToText(pdf);
          /* no dates at all means the pages are pictures, not text */
          if(!/\d{1,2}[./-]\d{1,2}[./-]\d{2,4}/.test(text)){
            const lim=SAMPLE?await SAMPLE.limits().catch(()=>null):null;
            if(!lim||!lim.images)throw {code:'scanned'};
            images=await pdfToImages(pdf,lim.images.maxCount);text='';
          }
        }
        let res;
        if(SAMPLE){q.msg='Claude קורא ומסווג…';renderFiles();
          try{res=await SAMPLE.json(claudePrompt(text,q.name),{modelTier:'default',images:images||undefined});}
          catch(e){if(text&&e&&!['cancelled','not_granted'].includes(e.code))res=parseLocally(text);else throw e;}}
        else if(text)res=parseLocally(text);
        else throw {code:'needs_claude'};
        q.card=q.card||cardFromName(res.card)||String(res.card||'').trim().split(/\s+\d/)[0]||cardFromName(text.slice(0,3000))||'';
        q.who=ownerOf(q.card);
        q.total=+res.statementTotal||null;
        q.rows=buildRows(res);
        if(!q.rows.length)throw {code:'empty'};
        q.status='ready';q.msg='';
      }catch(e){
        q.status='error';
        q.msg={cancelled:'דולג',scanned:'קובץ סרוק. כדי לקרוא אותו צריך לפתוח את המערכת מהקישור ב-claude.ai',needs_claude:'קריאת תמונה דורשת את הקישור ב-claude.ai',
          empty:'לא נמצאו תנועות בקובץ',not_granted:'צריך לאשר ל-Claude לקרוא את הפירוט',rate_limited:'יותר מדי בקשות, נסו שוב בעוד דקה',prompt_too_large:'הקובץ ארוך מדי'}[e&&e.code]||'לא הצלחתי לקרוא את הקובץ';
      }
      renderFiles();renderImport();
    }
  }finally{qBusy=false;}
}

    <h2><span>${esc(mLabel(A))} מול ${esc(mLabel(B))}${partial}</span><span class="row"><select id="cmpA" aria-label="חודש" style="width:auto">${monthOptions(A)}</select><span class="small">מול</span><select id="cmpB" aria-label="חודש להשוואה" style="width:auto">${monthOptions(B)}</select></span></h2>
    <div class="vs">
     <div class="side"><div class="lbl">${esc(nB)}</div><div class="big">${esc(money(b.expense))}</div><div class="mini"><span>הכנסות ${M(b.income)}</span><span>מאזן ${M(b.balance)}</span></div></div>
     <div class="mid"><div class="delta ${dE>0?'neg':'pos'}">${dE>0?'▲':'▼'} ${esc(money(Math.abs(dE)))}</div>${pill(dE>0?'bad':'good',(dE>0?'יותר':'פחות')+' הוצאות'+(b.expense?' · '+Math.round(Math.abs(dE)/b.expense*100)+'%':''))}</div>
     <div class="side cur"><div class="lbl">${esc(nA)}</div><div class="big">${esc(money(a.expense))}</div><div class="mini"><span>הכנסות ${M(a.income)}</span><span>מאזן ${M(a.balance)}</span></div></div>
    </div></div>
   <div class="g32">
    <div class="sheet"><h2>קטגוריה מול קטגוריה <span class="lgd"><span><span class="sw" style="background:var(--prev)"></span>${esc(nB)}</span><span><span class="sw" style="background:var(--accent)"></span>${esc(nA)}</span></span></h2>
     ${diffs.map(x=>pair(x.c.name,ccol(x.c.id),x.A,x.B,max)).join('')||'<div class="empty">אין נתונים</div>'}</div>
    <div class="stack">
     <div class="sheet"><h2>עלו הכי הרבה</h2>${up.map(mover).join('')||'<div class="small">שום קטגוריה לא עלתה.</div>'}</div>
     <div class="sheet"><h2>ירדו הכי הרבה</h2>${dn.map(mover).join('')||'<div class="small">שום קטגוריה לא ירדה.</div>'}</div>
     <div class="sheet"><h2>לפי מי</h2>${who.map(x=>pair(whoName(x.w),'',x.A,x.B,mw)).join('')||'<div class="small">אין נתונים</div>'}</div>
     <div class="sheet"><h2>לפי כרטיס</h2>${cards.map(x=>pair(x.n,'',x.A,x.B,mc)).join('')||'<div class="small">אין נתונים</div>'}</div>
    </div></div>`;
}

/* ---------- 13. trend ---------- */
function trendMonths(){const st=trackStart();let end=[ui.month,...monthsWithData()].sort().pop();if(end<st)end=st;const out=[];for(let m=st;m<=end&&out.length<240;m=addM(m,1))out.push(m);return out.slice(-12);}
function renderTrend(){
  const mks=trendMonths(),S=mks.map(monthSums),L=mks.map(mShort),full=S.filter(s=>!s.isCur&&s.expCount>=5);
  let run=0;const cum=S.map(s=>run+=s.balance);
  const avgE=full.length?sum(full,s=>s.expense)/full.length:0,avgI=full.length?sum(full,s=>s.income)/full.length:0;
  const best=full.filter(s=>s.income).sort((a,b)=>b.balance-a.balance)[0];
  const k=(l,v,d,tone)=>`<div class="k" data-tone="${tone||''}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="kd">${d}</div></div>`;
  const cats=state.cats.filter(c=>c.type==='expense').map(c=>({c,vals:S.map(s=>s.byCat[c.id]||0)})).filter(x=>sum(x.vals)>0).sort((a,b)=>sum(b.vals)-sum(a.vals));
  const cur=S[S.length-1];
  $('#panel-trend').innerHTML=`
   <div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr));margin:0">
    ${k('הוצאה ממוצעת לחודש',avgE?esc(money(avgE)):'—',full.length?'לפי '+full.length+' חודשים מלאים':'צריך חודש מלא אחד')}
    ${k('הכנסה ממוצעת לחודש',avgI?esc(money(avgI)):'—',avgI?'':'יתעדכן כשיוזנו הכנסות','good')}
    ${k('חיסכון מצטבר',esc(money(cum[cum.length-1])),'מאז '+esc(mLabel(mks[0])),cum[cum.length-1]>=0?'good':'bad')}
    ${k('החודש הכי טוב',best?esc(mLabel(best.mk)):'—',best?'נשארו '+M(best.balance):'צריך הכנסות כדי לחשב')}
   </div>
   <div class="g2">
    <div class="sheet"><h2>הכנסות מול הוצאות <span class="lgd"><span><span class="sw" style="background:var(--good)"></span>הכנסות</span><span><span class="sw" style="background:var(--bad)"></span>הוצאות</span></span></h2>
     ${colChart({labels:L,values:true,height:240,series:[{name:'הכנסות',color:'var(--good)',values:S.map(s=>s.income)},{name:'הוצאות',color:'var(--bad)',values:S.map(s=>s.expense)}]})}</div>
    <div class="sheet"><h2>כמה נשאר לנו, מצטבר</h2>${lineChart({labels:L,values:cum,height:240})}</div>
   </div>
   <div class="sheet"><h2>כל קטגוריה לאורך זמן <span class="sub">${esc(mName(cur.mk))}${cur.isCur?' (עד היום)':''} מול הממוצע של החודשים שלפניו</span></h2>
    ${cats.map(({c,vals})=>{const prevVals=vals.slice(0,-1).filter((v,i)=>S[i].expCount),av=prevVals.length?sum(prevVals)/prevVals.length:0,last=vals[vals.length-1];
      return `<div class="spk"><span class="nm"><span class="sw" style="background:${ccol(c.id)}"></span>${esc(c.name)}</span>${spark(vals,ccol(c.id),L)}
       <span class="avg">${av?'ממוצע '+N(av):''}</span><span>${av&&!cur.isCur?chg(last-av,av):pill('flat',N(last)+' ₪')}</span></div>`;}).join('')||'<div class="empty">אין נתונים עדיין</div>'}
   </div>`;
}

/* ---------- 14. settings (small, behind the gear) ---------- */
function renderSettings(){
  const s=state.settings,before=Object.keys(state.data).filter(k=>k<trackStart()).reduce((a,k)=>a+rowsOf(k).length,0);
  $('#setBody').innerHTML=`<div class="stack" style="gap:12px">
   <div class="g2" style="gap:10px"><div class="f"><label for="sNameA">שם ראשון</label><input id="sNameA" data-set="nameA" value="${esc(s.names.a)}"></div>
    <div class="f"><label for="sNameB">שם שני</label><input id="sNameB" data-set="nameB" value="${esc(s.names.b)}"></div></div>
   <div class="f"><label for="sStart">החודש הראשון במעקב</label><input id="sStart" type="month" data-set="startMonth" value="${trackStart()}"></div>
   ${before?`<p class="small" style="margin:0">${before} תנועות מלפני ${esc(mLabel(trackStart()))} שמורות אבל לא נספרות.</p>`:''}
   <div class="note"><span>${DB?'<b>הכל נשמר בענן</b> של חשבון Claude שלכם, אוטומטית. אין צורך לגבות.':'<b>הנתונים כרגע לא בענן.</b> פתחו את הקישור כשאתם מחוברים ל-Claude.'}</span></div>
   <details><summary class="small" style="cursor:pointer">עותק לביטחון (לא חובה)</summary><p class="small">קובץ עם כל הנתונים, למקרה שתרצו לשמור עותק אצלכם.</p><button class="btn sm" data-act="exportJSON">הורדת עותק</button></details>
  </div>`;
}

/* ---------- 15. render & events ---------- */
function commit(){persist();render();}
function render(){
  if(ui.month<trackStart())ui.month=trackStart();
  if(applyFixed())persist();
  memo.clear();renderHead();
  $$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===ui.tab)));
  $$('.panel').forEach(p=>p.hidden=p.id!=='panel-'+ui.tab);
  ({month:renderMonth,budget:renderBudget,compare:renderCompare,trend:renderTrend})[ui.tab]();
}
function go(tab){ui.tab=tab;try{localStorage.setItem('budgetHH.tab2',tab);}catch(e){}render();}
const nav=m=>{ui.touched=true;ui.month=m<trackStart()?trackStart():m;ui.cmpA=ui.cmpB=null;render();};
const ACT={
  mPrev:()=>{if(ui.month<=trackStart())return;nav(addM(ui.month,-1));},
  mNext:()=>nav(addM(ui.month,1)),
  mToday:()=>nav(curMonth()),
  theme:()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('budgetHH.theme',r.dataset.theme);}catch(e){}},
  openAdd:()=>openAdd('expense'),
  openIncome:()=>{openAdd('income');salaryHint();},
  closeAdd,
  kind:b=>{setKind(b.dataset.k);ui.catTouched=false;if(b.dataset.k==='income'){$('#fWho').value='a';salaryHint();}else $('#fHint').textContent='';},
  incChip:b=>{$('#fDesc').value=b.dataset.n;$('#fCat').value=b.dataset.c;ui.catTouched=true;if(b.dataset.c==='salary')salaryHint();else{$('#fHint').textContent='';$('#fDate').value=defaultDate();}$('#fAmount').focus();},
  delEdit:()=>{const id=ui.editId;closeAdd();const x=removeRow(id);if(!x)return;commit();toast('נמחק: '+x.row.desc,{label:'בטל',fn:()=>{state.data[x.k].rows.splice(x.i,0,x.row);commit();}});},
  edit:b=>startEdit(b.dataset.id),
  del:b=>{const x=removeRow(b.dataset.id);if(!x)return;commit();toast('נמחק: '+x.row.desc+' · '+money(x.row.amount),{label:'בטל',fn:()=>{state.data[x.k].rows.splice(x.i,0,x.row);commit();}});},
  recat:b=>{ui.recat=b.dataset.id;renderRows();},
  qDel:b=>{ui.queue=ui.queue.filter(q=>q.id!==b.dataset.id);renderFiles();renderImport();},
  impAdd,
  impCancel:()=>{ui.queue=ui.queue.filter(q=>q.status!=='ready');renderFiles();renderImport();},
  fileDel:async b=>{const id=b.dataset.id,m=state.data[ui.month],f=m&&(m.files||[]).find(x=>x.id===id);if(!f)return;
    const n=allRows().filter(r=>r.src===id).length;
    if(!await confirmBox('ביטול הקובץ '+f.name,n+' התנועות שנכנסו מהקובץ הזה יימחקו. אפשר להעלות אותו שוב אחר כך.','מחק '+n+' תנועות'))return;
    Object.keys(state.data).forEach(k=>{state.data[k].rows=rowsOf(k).filter(r=>r.src!==id);});m.files=m.files.filter(x=>x.id!==id);commit();toast('הקובץ בוטל');},
  suggest:()=>{const {avg,n}=avgPrev(ui.month,3);if(!n)return;state.cats.forEach(c=>{if(c.type==='expense'&&avg[c.id])c.budget=Math.ceil(avg[c.id]/50)*50;});commit();toast('התקציב מולא לפי ממוצע של '+n+' חודשים. אפשר לשנות כל סכום.');},
  clearBudget:()=>{const old=state.cats.map(c=>c.budget);state.cats.forEach(c=>c.budget=0);commit();toast('התקציב אופס',{label:'בטל',fn:()=>{state.cats.forEach((c,i)=>c.budget=old[i]);commit();}});},
  fxSugg:b=>{$('#fxDesc').value=b.dataset.n;$('#fxCat').value=b.dataset.c;$('#fxAmount').focus();},
  fxAdd:()=>{const desc=$('#fxDesc').value.trim(),amount=Math.round((+$('#fxAmount').value||0)*100)/100;
    if(!desc||!(amount>0)){toast('צריך תיאור וסכום');(desc?$('#fxAmount'):$('#fxDesc')).focus();return;}
    state.settings.fixed.push({id:uid(),desc,cat:$('#fxCat').value,amount,who:$('#fxWho').value,day:Math.min(31,Math.max(1,parseInt($('#fxDay').value)||1)),note:'',from:trackStart()});
    commit();fillForm();toast(desc+' נוסף לקבועות ונרשם בכל חודש');},
  fxDel:b=>{const L=state.settings.fixed,i=L.findIndex(x=>x.id===b.dataset.id);if(i<0)return;const it=L.splice(i,1)[0];
    commit();toast('"'+it.desc+'" הוסר מהקבועות. מה שכבר נרשם נשאר.',{label:'בטל',fn:()=>{L.splice(i,0,it);commit();}});},
  openSettings:()=>{renderSettings();$('#setDlg').hidden=false;},
  closeSettings:()=>{$('#setDlg').hidden=true;},
  exportJSON:async()=>{const ok=await saveFile('budget-'+todayISO()+'.json',JSON.stringify(state,null,1),'application/json');toast(ok?'העותק נשמר':'השמירה לא הצליחה בתצוגה הזו');}
};
function bind(){
  document.addEventListener('click',e=>{
    const tg=e.target.closest('[data-tabgo]');if(tg){go(tg.dataset.tabgo);return;}
    const tab=e.target.closest('.tab');if(tab){go(tab.dataset.tab);return;}
    const b=e.target.closest('[data-act]');if(b&&!b.closest('#modal')&&ACT[b.dataset.act]){e.preventDefault();ACT[b.dataset.act](b);}
  });
  $('#rowForm').addEventListener('submit',submitRow);
  $('#fDesc').addEventListener('input',onDescInput);
  $('#fCat').addEventListener('change',()=>{ui.catTouched=true;salaryHint();});
  $('#fSearch').addEventListener('input',e=>{ui.search=e.target.value;renderRows();});
  [['#fFilterCat','fCat'],['#fFilterWho','fWho'],['#fFilterNote','fNote']].forEach(([s,k])=>$(s).addEventListener('change',e=>{ui[k]=e.target.value;renderRows();}));
  ['addDlg','setDlg'].forEach(id=>$('#'+id).addEventListener('mousedown',e=>{if(e.target.id===id){if(id==='addDlg')closeAdd();else $('#setDlg').hidden=true;}}));
  document.addEventListener('keydown',e=>{if(e.key!=='Escape'||!$('#modal').hidden)return;if(!$('#addDlg').hidden)closeAdd();$('#setDlg').hidden=true;});
  const d=$('#drop');
  ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,()=>d.classList.remove('over')));
  d.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files)addFiles(e.dataTransfer.files);});
  document.addEventListener('change',e=>{
    const t=e.target,dd=t.dataset;
    if(t.id==='impFile'){addFiles(t.files);t.value='';return;}
    if(t.id==='mPick'){if(/^\d{4}-\d{2}$/.test(t.value))nav(t.value);return;}
    if(t.closest&&t.closest('#impReview')){impEdit(t);return;}
    if(t.id==='recat'){recategorize(dd.id,t.value);return;}
    if(t.id==='cmpA'){ui.cmpA=t.value;renderCompare();return;}
    if(t.id==='cmpB'){ui.cmpB=t.value;renderCompare();return;}
    if(dd.fx){fxEdit(t);return;}
    if(dd.budget){const c=state.cats.find(x=>x.id===dd.budget);if(c){c.budget=Math.max(0,Math.round(+t.value||0));commit();}return;}
    const s=state.settings;
    if(dd.set==='nameA')s.names.a=t.value.trim()||'יהונתן';
    else if(dd.set==='nameB')s.names.b=t.value.trim()||'רוני';
    else if(dd.set==='startMonth'){if(/^\d{4}-\d{2}$/.test(t.value))s.startMonth=t.value;}
    else return;
    commit();fillForm();renderSettings();
  });
  document.addEventListener('focusout',e=>{if(e.target.id==='recat')setTimeout(()=>{if(ui.recat){ui.recat=null;renderRows();}},150);});
}
(function init(){
  try{
    try{const th=localStorage.getItem('budgetHH.theme');if(th)document.documentElement.dataset.theme=th;
      const tb=localStorage.getItem('budgetHH.tab2');if(tb&&document.getElementById('panel-'+tb))ui.tab=tb;}catch(e){}
    let saved=loadSaved();if(saved&&saved.demo)saved=null;
    let seed=null;try{seed=JSON.parse($('#seed').textContent);}catch(e){}
    state=normalize(saved||seed||{});
    if(!saved)state.cloud=false;
    ui.month=openMonth();
    $('#fDate').value=todayISO();
    fillForm();bind();render();
    connectCapabilities();
  }catch(ex){
    console.error(ex);
    document.body.insertAdjacentHTML('afterbegin',`<div class="note bad" style="margin:16px"><b>שגיאה בטעינה:</b> ${esc(ex.message)}</div>`);
  }
})();
</script>
</body>
