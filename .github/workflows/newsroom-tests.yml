name: newsroom-tests

on:
  push:
    paths: ["newsroom/**", ".github/workflows/newsroom*.yml"]
  pull_request:
    paths: ["newsroom/**"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: newsroom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsroom/requirements.txt
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest -q
