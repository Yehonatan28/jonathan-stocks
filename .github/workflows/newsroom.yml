# חדר החדשות: הפעימה. רצה לפי לוח זמנים, והקוד מחליט מה צריך לקרות עכשיו.
# כל הזמנים כאן ב-UTC. המרת שעון ישראל/ניו יורק נעשית בקוד (scheduler.py), כך שמעברי שעון לא שוברים כלום.
name: newsroom

on:
  schedule:
    - cron: "57 3,4 * * *"   # לפני 07:00 בישראל: 03:57 UTC בקיץ, 04:57 UTC בחורף
    - cron: "17 * * * *"     # כל שעה: פקודות בוט + גיבוי למהדורה שהתעכבה
  workflow_dispatch:
    inputs:
      task:
        description: "מה להריץ"
        type: choice
        default: tick
        options: [tick, morning, probe, whoami]

permissions:
  contents: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: newsroom
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsroom/requirements.txt

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Load state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/state_pull.sh

      - name: Run
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python -m newsroom ${{ inputs.task || 'tick' }}

      - name: Save state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/state_push.sh

      - name: Save watchlist changes from the bot
        if: always()
        run: |
          if ! git diff --quiet -- config/watchlist.yaml; then
            git config user.name "newsroom-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/watchlist.yaml
            git commit -m "newsroom: watchlist updated from Telegram"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Last line of defence: Python itself could not start (bad install, syntax error...)
      - name: Watchdog
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 0
          curl -s -o /dev/null "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ המערכת נתקלה בתקלה: הרצה נכשלה ב-GitHub Actions. ${RUN_URL}"
